<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ledger — Student Budget Tracker</title>
<meta name="theme-color" content="#16261F">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="description" content="Ledger — a student budget tracker for allowance, scholar allowance, and school-day budgeting.">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2316261F'/%3E%3Crect x='24' y='24' width='52' height='52' rx='10' fill='%23E8A33D'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2316261F'/%3E%3Crect x='24' y='24' width='52' height='52' rx='10' fill='%23E8A33D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3EC;
  --paper-alt:#FFFFFF;
  --card-line:#DCE2D5;
  --ink:#16261F;
  --ink-soft:#5B6B60;
  --ink-faint:#8B978C;
  --accent:#E8A33D;
  --accent-ink:#5C3B0A;
  --allowance:#2F6F4E;
  --allowance-bg:#E4F0E9;
  --scholar:#3457A6;
  --scholar-bg:#E6EBF6;
  --extra:#8B4FD6;
  --extra-bg:#EFE5FA;
  --debt:#C1443C;
  --debt-bg:#F8E5E3;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 2px 10px rgba(22,38,31,0.07);
  --shadow-lift:0 8px 24px rgba(22,38,31,0.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{
  height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y;
  overscroll-behavior-x:none;
}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  min-height:100dvh;
  overscroll-behavior-y:none;
}
button, .rline, .navbtn, .subtab, .radiopill, .checkday{touch-action:manipulation;}
.mono{font-family:'IBM Plex Mono',monospace;}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.amount{white-space:nowrap;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* App shell */
#app{
  display:flex;
  min-height:100vh;
  max-width:1400px;
  margin:0 auto;
}
.sidenav{
  width:150px;
  flex-shrink:0;
  background:var(--paper-alt);
  border-right:1px solid var(--card-line);
  padding:24px 14px;
  display:flex;
  flex-direction:column;
  gap:4px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:15px;
  padding:0 10px 22px 10px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
}
.brand-mark{
  width:26px;height:26px;border-radius:7px;
  background:repeating-linear-gradient(135deg,var(--accent),var(--accent) 4px,#c9852a 4px,#c9852a 8px);
  flex-shrink:0;
}
.navbtn{
  display:flex;align-items:center;gap:10px;
  background:none;border:none;
  padding:11px 12px;border-radius:10px;
  color:var(--ink-soft);font-size:12px;font-weight:600;
  text-align:left;width:100%;
  transition:background .15s,color .15s;
}
.navbtn:hover{background:var(--paper);}
.navbtn.active{background:var(--ink);color:#fff;}
.navbtn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex-shrink:0;}

main{flex:1;min-width:0;padding:28px 30px 100px 30px;max-width:920px;}
.page{display:none;animation:fade .25s ease;}
.page.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.pagehead{margin-bottom:22px;}
.pagehead h1{font-size:23px;margin:0 0 3px 0;font-weight:700;}
.pagehead .sub{color:var(--ink-soft);font-size:13.5px;}

/* Bottom nav (mobile) */
.bottomnav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:var(--paper-alt);
  border-top:1px solid var(--card-line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  justify-content:space-between;
  z-index:50;
}
.bottomnav button{
  background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--ink-faint);font-size:10px;font-weight:600;padding:6px 2px;border-radius:8px;
  flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bottomnav button.active{color:var(--ink);}
.bottomnav button .ic{font-size:17px;}

/* Cards */
.card{
  background:var(--paper-alt);
  border:1px solid var(--card-line);
  border-radius:var(--radius);
  padding:18px 20px;
  box-shadow:var(--shadow);
}
.grid{display:grid;gap:14px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:760px){.grid-3{grid-template-columns:1fr;}.grid-2{grid-template-columns:1fr;}.grid-4{grid-template-columns:repeat(2,1fr);}}

/* Dashboard hero */
.hero{
  background:var(--ink);
  color:#fff;
  border-radius:20px;
  padding:26px 24px;
  position:relative;
  overflow:hidden;
  margin-bottom:16px;
}
.hero::after{
  content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,163,61,.35),transparent 70%);
}
.hero .eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#c7cec4;font-weight:600;display:flex;align-items:center;gap:4px;}
.hero .amount{font-family:'Space Grotesk',sans-serif;font-size:42px;font-weight:700;margin:6px 0 2px 0;letter-spacing:-.01em;white-space:nowrap;}
.hero .caption{color:#a9b3a5;font-size:13px;}

.walletrow{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.walletcard{
  flex:1;min-width:150px;
  border-radius:14px;padding:15px 16px;
  border:1px solid var(--card-line);
  position:relative;
}
.walletcard .wlabel{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:3px;
  width:max-content;
  max-width:100%; 

  font-size:8px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
  opacity:.75;

  white-space:nowrap;
  line-height:1.2;
}
.walletcard .wamt{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;margin-top:6px;white-space:nowrap;}
.nowrap-amount{white-space:nowrap;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.walletcard.allowance{background:var(--allowance-bg);color:var(--allowance);}
.walletcard.scholar{background:var(--scholar-bg);color:var(--scholar);}
.walletcard.extra{background:var(--extra-bg);color:var(--extra);}

/* Debt module gets its own "repayment ledger" identity — a split band rather than
   the dark hero + 3-card grid used by Dashboard/Money, per the design requirement
   that each module should be visually distinguishable at a glance. */
.debtsummary{
  display:flex;border-radius:18px;overflow:hidden;margin-bottom:10px;
  border:1px solid var(--card-line);box-shadow:var(--shadow);
}
.debtsummary-total{
  flex:1.3;background:var(--debt);color:#fff;padding:22px 20px;
}
.debtsummary-total .amount{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;margin-top:6px;}
.debtsummary-split{flex:1;display:flex;flex-direction:column;background:var(--paper-alt);}
.debtsummary-chip{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 18px;border-bottom:1px dashed var(--card-line);}
.debtsummary-chip:last-child{border-bottom:none;}
.debtsummary-chip .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
.debtsummary-chip .v{font-size:16px;font-weight:600;margin-top:2px;color:var(--debt);}
@media (max-width:520px){.debtsummary{flex-direction:column;}}

.variance-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:start;}
.variance-col{padding:0 20px;min-width:0;}
.variance-col-credits{border-right:1px solid var(--card-line);padding-left:0;}
.variance-col-debt{padding-right:0;}
@media (max-width:760px){
  .variance-grid{grid-template-columns:1fr;}
  .variance-col{padding:0;}
  .variance-col-credits{border-right:none;border-bottom:1px solid var(--card-line);padding-bottom:20px;margin-bottom:20px;}
}

.moneytransfer-card{
  display:flex;align-items:center;gap:14px;
  background:var(--accent-ink);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:18px;
  cursor:pointer;
}
.moneytransfer-ic{
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
}
.moneytransfer-title{font-weight:700;font-size:14.5px;}
.moneytransfer-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:1px;}

.statusband{
  border-radius:14px;padding:16px 18px;margin-bottom:16px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border:1px solid var(--card-line);
}
.statusband.under{background:var(--allowance-bg);}
.statusband.over{background:var(--debt-bg);}
.statusband.flat{background:var(--paper);}
.statusband .sb-title{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;}
.statusband .sb-figs{display:flex;gap:22px;flex-wrap:wrap;}
.statusband .fig .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;}
.statusband .fig .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;}

.actionrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.btn{
  border:none;border-radius:11px;padding:11px 16px;font-weight:700;font-size:13.5px;
  display:inline-flex;align-items:center;gap:7px;
}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:#233a2c;}
.btn-accent{background:var(--accent);color:var(--accent-ink);}
.btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--card-line);}
.btn-danger{background:var(--debt);color:#fff;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.sectiontitle{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--ink-soft);margin:22px 0 10px 0;}
.sectiontitle:first-child{margin-top:0;}

/* Receipt-style list */
.receipt{
  background:var(--paper-alt);border:1px solid var(--card-line);border-radius:var(--radius);
  padding:4px 0;
}
.rline{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 18px;
  border-bottom:1px dashed var(--card-line);
  cursor:pointer;
}
.rline:last-child{border-bottom:none;}
.rline:hover{background:var(--paper);}
.rline .rl-left{display:flex;gap:11px;align-items:center;min-width:0;}
.ricon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.rl-txt .rl-title{font-weight:600;font-size:13.8px;}
.rl-txt .rl-sub{font-size:11.8px;color:var(--ink-soft);margin-top:1px;}
.ramt{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;white-space:nowrap;}
.ramt.pos{color:var(--allowance);}
.ramt.neg{color:var(--ink);}
.ramt.debtc{color:var(--debt);}
.empty{padding:34px 18px;text-align:center;color:var(--ink-faint);font-size:13.5px;}
.rline-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.editbtn{background:none;border:1px solid var(--card-line);color:var(--ink-soft);font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;}
.editbtn:hover{background:var(--paper);color:var(--ink);}
.deletebtn{background:none;border:1px solid var(--debt);color:var(--debt);font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;}
.deletebtn:hover{background:var(--debt-bg);}
.expiredtag{font-size:10.5px;color:var(--ink-faint);font-style:italic;white-space:nowrap;}

/* Week strip */
.weekstrip{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.weekstrip{
  display:flex;
  gap:8px;
  margin-bottom:18px;
  flex-wrap:nowrap;
  width:100%;
}

.wday{
  flex:1 1 0;
  min-width:0;
  width:0;
  border-radius:12px;
  padding:10px 6px;
  text-align:center;
  border:1px solid var(--card-line);
  background:var(--paper-alt);
  overflow:hidden;
}

.wday .wd-name{
  font-size:10.5px;
  font-weight:700;
  color:var(--ink-soft);
  text-transform:uppercase;
  white-space:nowrap;
}

.wday .wd-status{
  font-size:16px;
  margin:5px 0 2px;
  line-height:1;
}

.wday .wd-amt{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.wday.today{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(232,163,61,.25);
}

.wday.selected{
  background:var(--ink);
}

.wday.selected .wd-name,
.wday.selected .wd-amt{
  color:#cfd6cc;
}

.wday.off{
  opacity:.4;
}

/* Phone: always keep Sun–Sat on ONE row */
@media (max-width:520px){
  .weekstrip{
    gap:4px;
    flex-wrap:nowrap;
  }

  .wday{
    flex:1 1 0;
    min-width:0;
    padding:9px 2px;
    border-radius:10px;
  }

  .wday .wd-name{
    font-size:9px;
  }

  .wday .wd-status{
    font-size:14px;
    margin:5px 0 2px;
  }

  .wday .wd-amt{
    font-size:9px;
  }
}

/* Forms / modal */
.overlay{
  position:fixed;inset:0;background:rgba(22,38,31,.42);
  display:none;align-items:flex-end;justify-content:center;z-index:100;
  padding:0;
}
.overlay.open{display:flex;}
@media (min-width:640px){.overlay{align-items:center;}}
.modal{
  background:var(--paper-alt);width:100%;max-width:480px;
  border-radius:20px 20px 0 0;
  padding:22px 22px calc(22px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;
  box-shadow:var(--shadow-lift);
  animation:slideup .22s ease;
}
@media (min-width:640px){.modal{border-radius:18px;}}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:none;opacity:1;}}
.modal h3{margin:0 0 16px 0;font-size:17px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;border:1px solid var(--card-line);border-radius:10px;padding:10px 12px;font-size:14px;
  background:var(--paper);color:var(--ink);
}
.field textarea{resize:vertical;min-height:56px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
.radiogroup{display:flex;gap:8px;flex-wrap:wrap;}
.radiopill{
  border:1px solid var(--card-line);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;
  background:var(--paper);color:var(--ink-soft);
}
.radiopill.sel{background:var(--ink);color:#fff;border-color:var(--ink);}
.radiopill.disabled{opacity:.4;}
.modalfoot{display:flex;gap:10px;margin-top:6px;}
.modalfoot .btn{flex:1;justify-content:center;}
.closex{position:absolute;top:16px;right:16px;background:none;border:none;font-size:19px;color:var(--ink-faint);}
.modal{position:relative;}
.helptext{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
.photopreview{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-top:8px;display:none;}

.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.chip.allowance{background:var(--allowance-bg);color:var(--allowance);}
.chip.scholar{background:var(--scholar-bg);color:var(--scholar);}
.chip.extra{background:var(--extra-bg);color:var(--extra);}
.chip.budgeted{background:var(--allowance-bg);color:var(--allowance);}
.chip.non_budgeted{background:var(--paper);color:var(--ink-soft);border:1px solid var(--card-line);}
.chip.debt{background:var(--debt-bg);color:var(--debt);}

.barrow{margin-bottom:12px;}
.barrow .brtop{display:flex;justify-content:space-between;font-size:12.8px;margin-bottom:5px;}
.barrow .brtop .cname{font-weight:600;}
.barrow .brtop .camt{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);}
.bartrack{height:8px;background:var(--paper);border-radius:6px;overflow:hidden;}
.barfill{height:100%;border-radius:6px;background:var(--accent);}

.tablewrap{width:100%;}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
table td, table th{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@media (max-width:520px){
  table{font-size:11px;}
  table th{font-size:9px;padding:6px 4px;}
  table td{padding:7px 4px;font-size:10.5px;}
}
table th{text-align:left;font-size:10.8px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--card-line);}
table td{padding:9px 10px;border-bottom:1px solid var(--card-line);font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
table tr:last-child td{border-bottom:none;}
.tag-under{color:var(--allowance);font-weight:600;}
.tag-over{color:var(--debt);font-weight:600;}

.checkgrid{display:flex;gap:8px;flex-wrap:nowrap;width:100%;}
.checkday{
  flex:1 1 0;min-width:0;
  border:1px solid var(--card-line);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;font-weight:700;
  background:var(--paper);color:var(--ink-soft);overflow:hidden;white-space:nowrap;
}
.checkday.on{background:var(--allowance);color:#fff;border-color:var(--allowance);}
@media (max-width:520px){
  .checkgrid{gap:4px;}
  .checkday{padding:8px 2px;font-size:10px;border-radius:8px;}
}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-lift);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.money-header{display:flex;flex-direction:column;}
@media (max-width:760px){
  .money-header .subtabs{order:1;}
  .money-header .moneytransfer-card{order:2;}
}
.subtabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.subtabs::-webkit-scrollbar{display:none;}
.subtab{
  border:1px solid var(--card-line);background:var(--paper-alt);border-radius:10px;padding:8px 14px;font-size:12.8px;font-weight:700;color:var(--ink-soft);
  flex:0 0 auto;white-space:nowrap;
}
.subtab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.eyebtn{background:none;border:none;font-size:14px;padding:0;margin:0;line-height:1;opacity:.85;cursor:pointer;}
.eyebtn:hover{opacity:1;}

/* ---- Money sources: 3-dot manage button (sits BETWEEN the balance card and the
   sources card, inside neither) + red circular remove icons shown only in manage mode ---- */
.srcmanage-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:44px;padding:0 2px;
}
.srcmanage-row.none{min-height:10px;}
.srcmanage-hint{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
.srcmanage-btn{
  width:40px;height:40px;border-radius:50%;

<body>

<div id="app">
  <nav class="sidenav" id="sidenav">
    <div class="brand"><span class="brand-mark"></span>Ledger</div>
  </nav>

  <main id="main">
    <!-- pages injected by JS -->
  </main>
</div>

<nav class="bottomnav" id="bottomnav"></nav>

<div id="save-indicator" style="position:fixed;top:calc(8px + env(safe-area-inset-top));right:12px;font-size:10.5px;font-weight:600;color:var(--ink-faint);background:var(--paper-alt);padding:3px 9px;border-radius:20px;border:1px solid var(--card-line);z-index:60;"></div>

<div id="gate" class="gate"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalbody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================= STATE ============================= */
const PESO = '₱';
const CATS_DEFAULT = ['Food','Transportation','School Necessities','Needs','Wants'];
const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const NAVS = [
  {id:'dashboard', label:'Dashboard', icon:'◆'},
  {id:'budget', label:'Budget', icon:'▦'},
  {id:'spending', label:'Spending', icon:'✎'},
  {id:'variance', label:'Variance', icon:'◈'},
  {id:'settings', label:'Settings', icon:'⚙'},
];

let state = null;
let appMeta = null; // onboarding / PIN / visibility — kept separate from financial data
let unlockedThisSession = false;
let currentTab = 'dashboard';
let settingsView = 'menu'; // 'menu' | 'personal' | 'privacy' | 'money' | 'insights' | 'schooldays'
let sourceEditMode = false; // Settings → Money: true while the 3-dot "remove sources" mode is on (UI-only, never persisted)
let saveTimer = null;
let lastSavedAt = null;
let saveState = 'idle'; // idle | saving | saved | error

/* ============================= OFFLINE STORAGE ENGINE =============================
   This app must work with zero internet connection — including when the file is
   downloaded and opened on a completely different phone. So storage here never talks
   to a server or depends on being online:

   - Primary store: localStorage. It's synchronous, built into every browser, requires
     no network call, and survives closing the app, refreshing, and restarting the
     phone.
   - Mirror store: IndexedDB, when available, as a second local copy with a larger
     quota (helpful once photos start accumulating). Writes go to both; reads prefer
     localStorage (instant, synchronous) and fall back to IndexedDB if localStorage is
     ever empty (e.g. a browser that clears localStorage more aggressively than IDB).
   - If this file happens to be running inside a Claude artifact (window.storage
     exists), we ALSO best-effort mirror saves there for cross-device sync within
     Claude — but that call is fire-and-forget and never affects the save indicator or
     blocks/fails a save. Local storage is always the source of truth.
*/
const LS_PREFIX = 'ledgerapp3:'; // bumped again for a clean start per this release; Settings > Privacy & Security > Reset App Data also available for manual resets going forward
let idbHandle = null;
function idbOpen(){
  return new Promise((resolve)=>{
    if(!('indexedDB' in window)){ resolve(null); return; }
    try{
      const req = indexedDB.open('ledger-db-v3', 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore('kv'); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>resolve(null);
    }catch(e){ resolve(null); }
  });
}
async function idbGet(key){
  try{
    if(!idbHandle) idbHandle = await idbOpen();
    if(!idbHandle) return null;
    return await new Promise((resolve)=>{
      const tx = idbHandle.transaction('kv','readonly');
      const req = tx.objectStore('kv').get(key);
      req.onsuccess = ()=>resolve(req.result!==undefined? req.result : null);
      req.onerror = ()=>resolve(null);
    });
  }catch(e){ return null; }
}
async function idbSet(key, value){
  try{
    if(!idbHandle) idbHandle = await idbOpen();
    if(!idbHandle) return false;
    return await new Promise((resolve)=>{
      const tx = idbHandle.transaction('kv','readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>resolve(false);
    });
  }catch(e){ return false; }
}
function lsGet(key){
  try{ return localStorage.getItem(LS_PREFIX+key); }catch(e){ return null; }
}
function lsSet(key, value){
  try{ localStorage.setItem(LS_PREFIX+key, value); return true; }catch(e){ return false; }
}
const hasClaudeStorage = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');

/* Read: localStorage first (instant + reliable), IndexedDB as a fallback if empty. */
async function localRead(key){
  const fromLS = lsGet(key);
  if(fromLS!==null) return fromLS;
  const fromIDB = await idbGet(key);
  return fromIDB;
}
/* Write: to BOTH local stores. Local write is the only thing that determines success —
   this never touches the network, so it can never fail due to "no connection". */
async function localWrite(key, value){
  const okLS = lsSet(key, value);
  const okIDB = await idbSet(key, value);
  // Best-effort only: never awaited by the caller's success/failure decision.
  if(hasClaudeStorage){ try{ window.storage.set(key, value, false); }catch(e){} }
  return okLS || okIDB;
}

function defaultState(){
  return {
    settings:{ schoolDays:[1,2,3,4,5], defaultBudget:100, defaultSource:'cash' },
    fundsBanks:[], scholarBanks:[],
    incomeTx:[], extraTx:[], transfers:[], budgets:[], expenses:[], debts:[], debtPayments:[], history:[], categories:[...CATS_DEFAULT]
  };
}
function defaultAppMeta(){
  return {
    onboardingCompleted:false,
    profile:null, // {name, userType, securityQuestion, securityAnswer, createdAt}
    pinHash:null, pinSalt:null, pinAlgo:null
  };
}

/* Full data wipe — clears every stored record (financial state AND app-meta/PIN/
   profile) from both localStorage and IndexedDB, resets in-memory state to fresh
   defaults, and re-enters the app at onboarding, exactly as if it had never been
   used. This does not touch the app's code — only stored user data. */
async function resetAllData(){
  try{ localStorage.removeItem(LS_PREFIX+'budget-app-state'); }catch(e){}
  try{ localStorage.removeItem(LS_PREFIX+'app-meta'); }catch(e){}
  try{ await idbSet('budget-app-state', null); }catch(e){}
  try{ await idbSet('app-meta', null); }catch(e){}
  state = defaultState();
  appMeta = defaultAppMeta();
  visibilityState = {total:false, funds:false, scholar:false, extra:false};
  budgetViewDate = null;
  sourceEditMode = false;
  currentTab = 'dashboard';
  settingsView = 'menu';
  startApp();
}

async function loadState(){
  try{
    const raw = await localRead('budget-app-state');
    state = raw ? JSON.parse(raw) : defaultState();
  }catch(e){ state = defaultState(); }
  if(!state.categories) state.categories = [...CATS_DEFAULT];
  if(!state.transfers) state.transfers = [];

  try{
    const rawMeta = await localRead('app-meta');
    appMeta = rawMeta ? JSON.parse(rawMeta) : defaultAppMeta();
  }catch(e){ appMeta = defaultAppMeta(); }
  visibilityState = {};

  // One-time migration from an earlier version of this app that stored a simple
  // {name, birthdate, age} profile directly on the financial state and had no PIN.
  // We carry the name forward and only ask the user to add a PIN (not redo onboarding).
  if(!appMeta.profile && state.profile){
    appMeta.profile = {
      name: state.profile.name || '',
      userType: '',
      securityQuestion: '', securityAnswer: '',
      createdAt: state.profile.createdAt || Date.now(),
      migratedFrom: 'legacy'
    };
    delete state.profile;
    scheduleSave();
    scheduleSaveMeta();
  }

  migrateExpenseTypes();
  migrateFundsHierarchy();
  migrateDebtAndBudgetModel();
  migrateSchoolDayConfigs();
  autoCloseBudgets();
  startApp();
}

function scheduleSave(){
  clearTimeout(saveTimer);
  saveState = 'saving'; updateSaveIndicator();
  saveTimer = setTimeout(async ()=>{
    const ok = await localWrite('budget-app-state', JSON.stringify(state));
    if(ok){ lastSavedAt = Date.now(); saveState = 'saved'; }
    else { saveState = 'error'; showToast('Could not save on this device/browser'); }
    updateSaveIndicator();
  }, 250);
}
let saveMetaTimer = null;
function scheduleSaveMeta(){
  clearTimeout(saveMetaTimer);
  saveMetaTimer = setTimeout(async ()=>{
    await localWrite('app-meta', JSON.stringify(appMeta));
  }, 150);
}
function updateSaveIndicator(){
  const el = document.getElementById('save-indicator');
  if(!el) return;
  if(saveState==='saving'){ el.textContent = 'Saving…'; el.style.color = 'var(--ink-faint)'; }
  else if(saveState==='error'){ el.textContent = 'Not saved on this device'; el.style.color = 'var(--debt)'; }
  else if(saveState==='saved'){ el.textContent = 'Saved on this device'; el.style.color = 'var(--ink-faint)'; }
  else { el.textContent = ''; }
}

/* Migration: expenses recorded before the Budgeted/Non-Budgeted distinction existed
   don't have an expenseType. We infer it from whether they were linked to a budget
   day at the time (budgetId set => was counting toward that day's budget => Budgeted),
   which preserves the historical budget math exactly as it was. */
function migrateExpenseTypes(){
  (state.expenses||[]).forEach(e=>{
    if(e.expenseType!==BUDGETED && e.expenseType!==NON_BUDGETED && e.expenseType!==SURPLUS){
      e.expenseType = e.budgetId ? BUDGETED : NON_BUDGETED;
    }
    if(e.expenseType===NON_BUDGETED || e.expenseType===SURPLUS){ e.budgetId = null; }
  });
}

/* Migration from the earlier model where:
   - Every Non-Budgeted expense auto-generated a "normal" debt record (relatedExpenseId
     set) and ALSO deducted straight from its source. Under the new model, only
     Non-Budgeted + "Wants" expenses become debt (now called "personal", and they no
     longer deduct from a source at all); "Needs" and everything else are a plain
     direct deduction with no debt. We rename those old auto debts to 'personal' so
     they keep showing correctly, and null out the expense's source if its category is
     "Wants" so it stops being double-counted as also deducting real money.
   - Budgets used to carry a `source` field that never actually moved money (dead
     weight under the new model) — simply drop it. */
function migrateDebtAndBudgetModel(){
  (state.debts||[]).forEach(d=>{
    if(d.debtType==='normal' && d.relatedExpenseId){ d.debtType = 'personal'; }
  });
  (state.expenses||[]).forEach(e=>{
    if(e.expenseType===NON_BUDGETED && e.category==='Wants' && e.source){ e.source = null; }
  });
  (state.budgets||[]).forEach(b=>{ if('source' in b) delete b.source; });
}

/* Migration from the earlier flat "Allowance"/"Scholar Allowance" account model to
   the new Funds (Cash on Hand + Funds E-Banks) / Scholar Allowance (Scholar E-Banks
   only) hierarchy. Old records referred to a top-level key ('allowance' or
   'scholar') directly; the new model requires an actual node ('cash', 'fbank:X', or
   'sbank:X'). Old "allowance" money becomes Cash on Hand (a 1:1 concept match — both
   represent undifferentiated real money with no bank). Old "scholar" money has
   nowhere equivalent to land, since Scholar Allowance can no longer hold cash
   directly — so a single Scholar E-Bank named "Scholar Wallet" is created on demand
   to hold it, preserving the exact same balance under the new required structure. */
function migrateFundsHierarchy(){
  if(!state.fundsBanks) state.fundsBanks = [];
  if(!state.scholarBanks) state.scholarBanks = [];
  const hasOldScholarData = ['incomeTx','expenses','debtPayments'].some(arr=>
    (state[arr]||[]).some(x=> x.type==='scholar' || x.source==='scholar' || x.from==='scholar' || x.to==='scholar')
  ) || (state.transfers||[]).some(t=>t.from==='scholar'||t.to==='scholar')
    || (state.settings && state.settings.defaultSource==='scholar');
  let legacyScholarBankId = null;
  if(hasOldScholarData){
    const bank = addScholarBank('Scholar Wallet');
    legacyScholarBankId = bank.id;
  }
  const remap = (key)=>{
    if(key==='allowance') return 'cash';
    if(key==='scholar') return legacyScholarBankId ? 'sbank:'+legacyScholarBankId : 'cash';
    return key;
  };
  (state.incomeTx||[]).forEach(x=>{
    if(x.node===undefined && x.type!==undefined){ x.node = remap(x.type); delete x.type; }
  });
  (state.expenses||[]).forEach(e=>{
    if(e.source==='allowance' || e.source==='scholar'){ e.source = remap(e.source); }
  });
  (state.transfers||[]).forEach(t=>{
    if(t.from==='allowance'||t.from==='scholar'){ t.from = remap(t.from); }
    if(t.to==='allowance'||t.to==='scholar'){ t.to = remap(t.to); }
  });
  (state.debtPayments||[]).forEach(p=>{
    if(p.source==='allowance'||p.source==='scholar'){ p.source = remap(p.source); }
  });
  if(state.settings && (state.settings.defaultSource==='allowance' || state.settings.defaultSource==='scholar')){
    state.settings.defaultSource = remap(state.settings.defaultSource);
  }
}

/* ============================= PIN SECURITY =============================
   The PIN itself is never stored or logged in plain text. We hash it (SHA-256 via
   Web Crypto, salted per-installation) and only ever compare hashes. Web Crypto works
   fine offline and in file:// contexts (treated as a secure context by browsers); if
   it's ever unavailable we fall back to a simple non-cryptographic hash rather than
   storing the PIN as plain text. */
function randomSalt(){
  try{
    const arr = new Uint8Array(16);
    crypto.getRandomValues(arr);
    return [...arr].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
}
async function hashPin(pin, saltHex){
  try{
    if(window.crypto && window.crypto.subtle){
      const data = new TextEncoder().encode(saltHex+':'+pin);
      const buf = await crypto.subtle.digest('SHA-256', data);
      return {hex:[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''), algo:'sha256'};
    }
  }catch(e){}
  let h = 5381;
  const s = saltHex+':'+pin;
  for(let i=0;i<s.length;i++){ h = ((h*33) ^ s.charCodeAt(i)) >>> 0; }
  return {hex:h.toString(16), algo:'djb2-fallback'};
}
async function setPin(pin){
  const salt = randomSalt();
  const {hex, algo} = await hashPin(pin, salt);
  appMeta.pinSalt = salt; appMeta.pinHash = hex; appMeta.pinAlgo = algo;
  scheduleSaveMeta();
}
async function verifyPin(pin){
  if(!appMeta.pinHash || !appMeta.pinSalt) return false;
  const {hex} = await hashPin(pin, appMeta.pinSalt);
  return hex === appMeta.pinHash;
}

/* ============================= BALANCE VISIBILITY =============================
   Purely a display concern — never touches the underlying numbers used in any
   calculation. Every sensitive amount (Total Money, Allowance, Scholar Allowance,
   Credits) is HIDDEN by default every time the app is opened, and reveals only
   while the user taps the eye icon — this is intentionally NOT a persisted setting;
   there is no separate "Balance Privacy" toggle to configure. */
let visibilityState = {};
function isVisible(key){ return !!visibilityState[key]; }
function maskedFmt(amount, key){ return isVisible(key) ? fmt(amount) : '₱ ••••••'; }
const ICON_EYE = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12s4-7.5 10.5-7.5S22.5 12 22.5 12s-4 7.5-10.5 7.5S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const ICON_EYE_OFF = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2C11 5.07 11.5 5 12 5c6.5 0 10.5 7 10.5 7a13.9 13.9 0 0 1-3.1 3.9M6.6 6.6C3.7 8.3 1.5 12 1.5 12s4 7 10.5 7c1.7 0 3.2-.4 4.5-1.1"/><path d="M9.9 10a3 3 0 0 0 4.2 4.2"/></svg>`;
/* Vertical 3-dot (manage sources) and red circular minus (remove source) icons. */
const ICON_DOTS = `<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>`;
const ICON_MINUS = `<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><rect x="6.5" y="10.75" width="11" height="2.5" rx="1.25" fill="#fff"/></svg>`;
function eyeToggle(key, extraStyle){
  return `<button type="button" class="eyebtn" data-visibility="${key}" style="${extraStyle||''}" title="${isVisible(key)?'Hide':'Show'} amount" aria-label="${isVisible(key)?'Hide':'Show'} amount">${isVisible(key)?ICON_EYE:ICON_EYE_OFF}</button>`;
}
function wireVisibilityToggles(){
  document.querySelectorAll('[data-visibility]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const key = el.dataset.visibility;
      visibilityState[key] = !isVisible(key);
      render();
    };
  });
}

/* ============================= ONBOARDING / PIN GATE =============================
   Full-screen flow shown instead of the app: Welcome → About → Details → Create PIN
   on first use, or just the PIN lock screen on every later open. This state
   (onboardingCompleted, profile, pinHash) is intentionally separate from the
   financial transaction data (state), so changing/resetting it never touches
   Allowance, Scholar Allowance, budgets, spending, or history. */
let draftProfile = {name:'', userType:'', securityQuestion:'', securityAnswer:''};

function showGateShell(){
  document.body.classList.add('gate-active');
  document.getElementById('gate').style.display = 'flex';
}
function enterApp(){
  unlockedThisSession = true;
  document.body.classList.remove('gate-active');
  document.getElementById('gate').style.display = 'none';
  render();
}

function pinDotsHTML(value){
  let dots='';
  for(let i=0;i<4;i++){ dots += `<div class="pindot ${i<value.length?'filled':''}"></div>`; }
  return `<div class="pindots">${dots}</div>`;
}
function keypadHTML(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','back'];
  return `<div class="keypad">${keys.map(k=>{
    if(k==='') return `<div></div>`;
    if(k==='back') return `<button type="button" class="keypadbtn keypad-back" data-key="back">⌫</button>`;
    return `<button type="button" class="keypadbtn" data-key="${k}">${k}</button>`;
  }).join('')}</div>`;
}
/* Reusable two-step (enter, then confirm) PIN capture. Renders into any container —
   the full-screen gate for onboarding/recovery, or a settings modal for changing an
   existing PIN. */
function mountPinFlow(container, {title, sub, onSuccess, mismatchMsg}){
  let stage='enter', firstPin='', buffer='', errorMsg='';
  function draw(){
    container.innerHTML = `
      <div class="gatecard" style="box-shadow:none;border:none;padding:4px 0;">
        <h1 class="gate-title" style="font-size:19px">${stage==='enter'? title : 'Confirm PIN'}</h1>
        <p class="gate-sub">${stage==='enter'? sub : 'Enter the same PIN again to confirm.'}</p>
        ${pinDotsHTML(buffer)}
        <div class="pin-error">${errorMsg}</div>

    container.querySelectorAll('.keypadbtn').forEach(b=>{

/* ============================= SCHOOL DAY CONFIGURATION HISTORY =============================
   "School Days" describes an ongoing habit that can change over time (e.g. a new
   class schedule mid-semester) — it is NOT a permanent rule that should be replayed
   backwards over already-established budgets. So instead of one flat setting, school
   days are stored as a list of versioned configs, each with an effectiveFrom date:

     { id, effectiveFrom: "2026-09-17", schoolDays: [3,5], createdAt }

   The config that governs any given date is whichever version has the LATEST
   effectiveFrom that is still <= that date. This means:
     - Changing School Days today only ever appends (or, if you already changed it
       earlier today, updates) a version effective from today onward.
     - Every date before today keeps resolving to whatever version was in force then,
       so past weekly/monthly totals, Credits, and Debt derived from them never shift
       under you.
     - Weekly/monthly projections for TODAY and the FUTURE naturally pick up the new
       configuration, since isSchoolDay()/expectedForDays() always resolve per-date.
   Individual budget records (state.budgets) also separately remember which config
   governed them at creation time (schoolDayConfigId) purely for reference — the
   source of truth for "was this a school day" for any date is always this history,
   not that stamped id.
*/
function migrateSchoolDayConfigs(){
  if(!state.schoolDayConfigs || !state.schoolDayConfigs.length){
    // Pre-existing installs only ever had one flat setting — preserve it as a single
    // baseline version covering all of their history (and the present), so migrating
    // to versioned configs never changes anything that already happened.
    state.schoolDayConfigs = [{
      id: uid(),
      effectiveFrom: '2000-01-01',
      schoolDays: [...(state.settings.schoolDays||[1,2,3,4,5])],
      createdAt: Date.now()
    }];
  }
}
/* The config that governs a given date = the one with the latest effectiveFrom that
   is still on or before that date. */
function schoolDaysConfigForDate(dateStr){
  let best = null;
  state.schoolDayConfigs.forEach(c=>{
    if(c.effectiveFrom<=dateStr && (!best || c.effectiveFrom>best.effectiveFrom)) best = c;
  });
  return best || state.schoolDayConfigs[0];
}
function schoolDaysForDate(dateStr){
  return schoolDaysConfigForDate(dateStr).schoolDays;
}
/* The version in effect "as of right now" — used to prefill the Settings UI and to
   decide whether a fresh edit should create a new version or adjust today's. */
function currentSchoolDaysConfig(){
  return schoolDaysConfigForDate(todayStr());
}
/* Applying a School Days change NEVER mutates a version that has already started
   governing past dates. If the user already changed it earlier today, we update that
   same today-dated version in place (so repeated edits in one sitting don't pile up
   duplicate versions); otherwise we append a brand-new version effective from today,
   leaving every earlier version — and therefore every date before today, including
   any budget already established for today — exactly as it was. */
/* A past School Days history entry can be corrected directly (not by appending a new
   version) for a short 7-day grace window after it was set — separate from the
   general 1-month editability window used for expenses/budgets/etc. elsewhere. After
   7 days it's locked, so a config that has already been governing real budgets for a
   while can't quietly change out from under them. */
function canEditSchoolDayConfig(createdAt){
  if(!createdAt) return true;
  return Date.now() < createdAt + 7*24*60*60*1000;
}
function applySchoolDaysChange(newDays){
  const t = todayStr();
  const latest = currentSchoolDaysConfig();
  if(latest.effectiveFrom===t){
    latest.schoolDays = [...newDays];
  } else {
    state.schoolDayConfigs.push({id:uid(), effectiveFrom:t, schoolDays:[...newDays], createdAt:Date.now()});
  }
  state.settings.schoolDays = [...newDays]; // mirrored for any legacy reads
}
/* ============================= MONEY NODE HIERARCHY =============================
   Every actual-money location in the app ("node") is identified by a single string
   key used everywhere a transaction needs to say where money came from or went:
     'cash'        — Funds → Cash on Hand (the only node with no bank record)
     'fbank:<id>'  — Funds → E-Money → a specific Funds E-Bank (state.fundsBanks)
     'sbank:<id>'  — Scholar Allowance → a specific Scholar E-Bank (state.scholarBanks)
     'extra'       — Credits (Variance) — not part of Total Money, unaffected by
                     this hierarchy change.
   Funds = Cash on Hand + all Funds E-Banks. Scholar Allowance = all Scholar E-Banks
   (it deliberately has no Cash on Hand and no separate "Scholar E-Money" layer — the
   E-Banks themselves ARE the Scholar Allowance balance). Total Money = Funds +
   Scholar Allowance only. */
function nodeGroup(key){
  if(key==='cash' || (key&&key.startsWith('fbank:'))) return 'funds';
  if(key&&key.startsWith('sbank:')) return 'scholar';
  if(key==='extra') return 'extra';
  return null;
}
function fundsBankById(id){ return state.fundsBanks.find(b=>b.id===id); }
function scholarBankById(id){ return state.scholarBanks.find(b=>b.id===id); }
/* fundsNodes()/scholarNodes() deliberately include EVERY bank record — including banks
   the user has since removed (those are kept with a `removedAt` stamp, see
   removeMoneySource()). All balances are derived from these lists, so money can never
   silently vanish from Total Money just because a source was removed from the UI.
   The active*() helpers below are what every picker/list uses for "the sources the
   user currently has configured in Settings → Money". */
function fundsNodes(){ return ['cash', ...state.fundsBanks.map(b=>'fbank:'+b.id)]; }
function scholarNodes(){ return state.scholarBanks.map(b=>'sbank:'+b.id); }
function activeFundsBanks(){ return state.fundsBanks.filter(b=>!b.removedAt); }
function activeScholarBanks(){ return state.scholarBanks.filter(b=>!b.removedAt); }
function activeFundsNodes(){ return ['cash', ...activeFundsBanks().map(b=>'fbank:'+b.id)]; }
function activeScholarNodes(){ return activeScholarBanks().map(b=>'sbank:'+b.id); }
/* True for Cash on Hand, Credits, and any bank that hasn't been removed. */
function nodeIsActive(key){
  if(key==='cash' || key==='extra') return true;
  if(key && key.startsWith('fbank:')){ const b=fundsBankById(key.slice(6)); return !!b && !b.removedAt; }
  if(key && key.startsWith('sbank:')){ const b=scholarBankById(key.slice(6)); return !!b && !b.removedAt; }
  return false;
}
/* Removed banks that still hold a non-zero balance (only possible through an edge case
   like force-deleting income after the bank was emptied). They stay visible — flagged
   "(removed)" — so no money is ever hidden from the person. */
function removedNodesWithBalance(group){
  const banks = group==='funds' ? state.fundsBanks : state.scholarBanks;
  const p = group==='funds' ? 'fbank:' : 'sbank:';
  return banks.filter(b=>b.removedAt && Math.abs(computeAccountBalance(p+b.id))>0.004).map(b=>p+b.id);
}
/* How many transaction records point at this node. Used to decide between fully
   deleting a bank (nothing references it) and archiving it (history must keep resolving
   its name and balance). */
function nodeReferenceCount(key){
  let n = 0;
  n += state.incomeTx.filter(x=>x.node===key).length;
  n += state.expenses.filter(e=>e.source===key).length;
  n += state.transfers.filter(t=>t.from===key || t.to===key).length;
  n += state.debtPayments.filter(p=>p.source===key).length;
  return n;
}
function escapeHTML(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nodeLabel(key){
  if(key==='cash') return 'Cash on Hand';
  if(key==='extra') return 'Credits';
  if(key&&key.startsWith('fbank:')){ const b=fundsBankById(key.slice(6)); return b? b.name : 'Funds E-Bank'; }
  if(key&&key.startsWith('sbank:')){ const b=scholarBankById(key.slice(6)); return b? b.name : 'Scholar E-Bank'; }
  return key;
}
/* accountLabel() names the top-level group a node belongs to (used anywhere the UI
   previously said "Allowance"/"Scholar Allowance"/"Credits" generically). For a
   specific node's own display name, use nodeLabel() instead. */
function accountLabel(key){
  const g = nodeGroup(key);
  return g==='funds' ? 'Funds' : g==='scholar' ? 'Scholar Allowance' : 'Credits';
}
/* Name uniqueness is checked against banks the user currently has — a removed bank's
   name is free to be reused (the new one is a brand-new, separate source). */
function addFundsBank(name){
  name = (name||'').trim();
  if(!name) return null;
  if(activeFundsBanks().some(b=>b.name.toLowerCase()===name.toLowerCase())) return null;
  const b = {id:uid(), name, createdAt:Date.now()};
  state.fundsBanks.push(b);
  return b;
}
function addScholarBank(name){
  name = (name||'').trim();
  if(!name) return null;
  if(activeScholarBanks().some(b=>b.name.toLowerCase()===name.toLowerCase())) return null;
  const b = {id:uid(), name, createdAt:Date.now()};
  state.scholarBanks.push(b);
  return b;
}
/* Removes an E-Bank from the person's configured money sources. Cash on Hand is
   permanent and can never be removed.

   Safety rules (the ledger is derived from transactions, so nothing is ever rewritten):
   - A bank must be at zero before it can go. If it still holds money, the caller first
     moves that balance out with a normal transfer (see modalRemoveSource), so Total
     Money is untouched.
   - Never referenced by any transaction → truly deleted from the list.
   - Referenced by past transactions → kept in the list with a `removedAt` stamp
     ("archived"): every historical record keeps its name and its exact effect, but the
     bank disappears from Funds/Scholar Allowance, pickers, and default-source choices. */
function removeMoneySource(node){
  const g = nodeGroup(node);
  if(node==='cash') return {ok:false, msg:"Cash on Hand is a permanent source and can't be removed."};
  if(g!=='funds' && g!=='scholar') return {ok:false, msg:"This source can't be removed."};
  const list = g==='funds' ? state.fundsBanks : state.scholarBanks;
  const idx = list.findIndex(b=>b.id===node.slice(6));
  if(idx<0 || list[idx].removedAt) return {ok:false, msg:'E-Bank not found.'};
  const bal = computeAccountBalance(node);
  if(Math.abs(bal)>0.005) return {ok:false, msg:`${list[idx].name} still holds ${fmt(bal)}. Move it to another source first.`};
  if(state.settings.defaultSource===node) state.settings.defaultSource = 'cash';
  delete visibilityState[node];
  if(nodeReferenceCount(node)===0){
    list.splice(idx,1);
    return {ok:true, archived:false};
  }
  list[idx].removedAt = Date.now();
  return {ok:true, archived:true};
}

/* ---- 1-month editability window (calendar month, based on createdAt) ---- */
function editableUntil(createdAtMs){

  d.setMonth(d.getMonth()+1);

}
function canEdit(createdAtMs){

function addHistory(type,label,amount,meta,transactionDate){
  // transactionDate = the date the activity actually belongs to (defaults to today
  // only for activity that has no other natural date, e.g. a debt payment made now).
  // ts = when the record was entered, used only as a tie-breaker for same-day items,
  // never as a substitute for the transaction date itself.
  state.history.unshift({id:uid(), date:transactionDate||todayStr(), type, label, amount, meta:meta||{}, ts:Date.now()});

}

/* ============================= DERIVED (TRANSACTION-BASED) BALANCES ============================= */
/* Balances are always derived from the underlying transaction ledger rather than
   incrementally mutated, so editing a past transaction can never corrupt or double-count.
   This works identically for ANY node key — 'cash', 'fbank:X', 'sbank:X' — since every
   transaction (income, expense, transfer, debt payment) stores the exact node it
   touched, not just a top-level group. */
function computeAccountReceived(key){
  if(key==='extra') return round2(state.extraTx.reduce((s,x)=>s+x.amount,0));
  return round2(state.incomeTx.filter(x=>x.node===key).reduce((s,x)=>s+x.amount,0));
}
function computeAccountBalance(key){
  if(key==='extra') return computeExtraMoneyBalance();
  const inflow = computeAccountReceived(key);
  // Every expense with a real money Source deducts from that node — Budgeted,
  // Non-Budgeted, and Surplus alike. The one exception is a Non-Budgeted + "Wants"
  // expense: it has no source at all (source stays null), because it becomes
  // Personal Debt instead of an immediate deduction — so this filter naturally
  // excludes it.
  const outExpenses = round2(state.expenses.filter(e=>e.source===key).reduce((s,e)=>s+e.amount,0));
  const outDebtPay = round2(state.debtPayments.filter(p=>p.source===key).reduce((s,p)=>s+p.amount,0));
  // Transfers can move money between ANY two real-money nodes (within Funds, within
  // Scholar Allowance, or between the two) — they relocate money, never create or
  // destroy it, and never count as income.
  const transferIn = round2(state.transfers.reduce((s,tx)=>tx.to===key? s+tx.amount : s, 0));
  const transferOut = round2(state.transfers.reduce((s,tx)=>tx.from===key? s+tx.amount : s, 0));
  return round2(inflow + transferIn - transferOut - outExpenses - outDebtPay);
}
function computeFundsBalance(){ return round2(fundsNodes().reduce((s,n)=>s+computeAccountBalance(n),0)); }
function computeScholarBalance(){ return round2(scholarNodes().reduce((s,n)=>s+computeAccountBalance(n),0)); }

/* Balance of a money node (or 'extra' for Credits) as if a given expense didn't exist.
   Used when adding/editing an expense so we compare against what's REALLY available:
   when editing, the old version of the expense has already been deducted, so it must
   be "given back" before checking whether the new amount fits. Pass null for a new
   expense (nothing to exclude). */
function balanceExcludingExpense(key, excludeId){
  const saved = state.expenses;
  state.expenses = saved.filter(e=>e.id!==excludeId);
  const bal = computeAccountBalance(key);
  state.expenses = saved;
  return bal;
}

/* Credits is a tracked SURPLUS/VARIANCE, never actual money — it is never added
   to Total Money (see totalMoney()). It is derived live, never incrementally stored:
     + Budget Excess entries (state.extraTx, created by syncDebtsAndExtras when a
       closed budget day finished under its limit)
     − Debt payments made using Credits (Overrun Debt / Personal Debt payoffs)
     − Surplus-type expenses, which spend down accumulated Credits. A Surplus
       expense ALSO deducts its full amount from its selected real money node
       (Funds/Scholar Allowance) like any other real expense — see
       computeAccountBalance() above — while separately consuming up to that same
       amount from the Credits pool. Consumption is processed oldest-first and
       capped at whatever is still available at that point, so Credits can never
       go negative even if a Surplus expense's amount exceeds what was available when
       it was recorded. */
function computeExtraMoneyBalance(){
  let bal = round2(state.extraTx.reduce((s,x)=>s+x.amount,0));
  bal = round2(bal - state.debtPayments.filter(p=>p.source==='extra').reduce((s,p)=>s+p.amount,0));
  if(bal<0) bal=0;
  const surplusExpenses = state.expenses.filter(e=>e.expenseType===SURPLUS).slice().sort((a,b)=> a.date!==b.date ? (a.date<b.date?-1:1) : (a.createdAt||0)-(b.createdAt||0));
  surplusExpenses.forEach(e=>{
    const consume = Math.min(bal, e.amount);
    bal = round2(bal - consume);
  });
  return round2(Math.max(0, bal));
}
function totalMoney(){
  // Actual money only: Funds (Cash on Hand + Funds E-Banks) + Scholar Allowance
  // (Scholar E-Banks). Credits is a tracked surplus/variance, never part of
  // Total Money — see computeExtraMoneyBalance().
  return round2(computeFundsBalance()+computeScholarBalance());
}
function totalDebt(){
  return round2(state.debts.filter(d=>d.status==='active').reduce((s,d)=>s+d.remaining,0));
}
function totalOverrunDebt(){
  return round2(state.debts.filter(d=>d.status==='active'&&d.debtType==='overrun').reduce((s,d)=>s+d.remaining,0));
}
function totalPersonalDebt(){
  return round2(state.debts.filter(d=>d.status==='active'&&d.debtType==='personal').reduce((s,d)=>s+d.remaining,0));
}
function totalBorrowedDebt(){
  return round2(state.debts.filter(d=>d.status==='active'&&d.debtType==='borrowed').reduce((s,d)=>s+d.remaining,0));
}

/* ============================= CORE MUTATIONS ============================= */
function addIncome(node, amount, date, note){
  amount = round2(amount);
  state.incomeTx.unshift({id:uid(), node, amount, date, note:note||'', createdAt:Date.now()});
  addHistory('income', `${accountLabel(node)} Added — ${nodeLabel(node)}`, amount, {node}, date);
}

/* Allowance <-> Scholar Allowance transfer. Credits is never a valid endpoint —
   it only ever changes via budget excess, spending, or debt payment.
   A transfer relocates money between categories; it is never counted as income
   and never touches budget/excess/overrun/debt calculations. */
function doTransfer(amount, from, to, date){
  amount = round2(amount);
  const validNode = (k)=> k==='cash' || (k&&k.startsWith('fbank:')) || (k&&k.startsWith('sbank:'));
  if(!validNode(from) || !validNode(to)){
    return {ok:false, msg:'Transfers are only allowed between Funds and Scholar Allowance nodes.'};
  }
  if(from===to) return {ok:false, msg:'Choose two different accounts.'};
  if(!amount || amount<=0) return {ok:false, msg:'Enter a valid amount.'};
  const bal = computeAccountBalance(from);
  if(amount > bal+0.001) return {ok:false, msg:`Insufficient balance.`};
  const txDate = date || todayStr();
  state.transfers.unshift({id:uid(), amount, from, to, date:txDate, createdAt:Date.now(), status:'completed'});
  addHistory('transfer', `${nodeLabel(from)} → ${nodeLabel(to)}`, amount, {from, to}, txDate);
  return {ok:true};
}

/* Only Budgeted expenses linked to a budget day count toward that day's spending —
   Non-Budgeted expenses always have budgetId=null and so are naturally excluded here. */
function spentForBudget(budgetId){
  return round2(state.expenses.filter(e=>e.budgetId===budgetId && e.expenseType===BUDGETED).reduce((s,e)=>s+e.amount,0));
}

/* Live, always-current result for a budget day — never relies on stale stored values. */
function budgetResult(b){
  const spent = spentForBudget(b.id);
  // A future day hasn't happened yet — there is no final spending result, so excess
  // and overrun must stay at zero until the day arrives (and ultimately closes).
  if(b.date > todayStr()) return {spent, excess:0, overrun:0};
  let excess = 0, overrun = 0;
  if(spent < b.amount - 0.001) excess = round2(b.amount-spent);
  else if(spent > b.amount + 0.001) overrun = round2(spent-b.amount);
  return {spent, excess, overrun};
}

/* Non-Budgeted spending for a given date — purely informational, never feeds
   into excess/overrun/debt/extra-money calculations. */
function nonBudgetedSpentForDate(dateStr){
  return round2(state.expenses.filter(e=>e.date===dateStr && e.expenseType===NON_BUDGETED).reduce((s,e)=>s+e.amount,0));
}
function nonBudgetedSpentForDates(dates){
  const set = new Set(dates);
  return round2(state.expenses.filter(e=>set.has(e.date) && e.expenseType===NON_BUDGETED).reduce((s,e)=>s+e.amount,0));
}

function getOrCreateBudget(date, amount, schoolDay){
  let b = state.budgets.find(x=>x.date===date);
  if(b){ b.amount=round2(amount); b.isSchoolDay=schoolDay; return b; }
  const cfg = schoolDaysConfigForDate(date);
  b = {id:uid(), date, amount:round2(amount), isSchoolDay:schoolDay, schoolDayConfigId:cfg.id, closed:false, createdAt:Date.now()};
  state.budgets.push(b);
  state.budgets.sort((a,c)=>a.date<c.date?1:-1);
  return b;
}

function closeBudget(b){
  b.closed = true;
  b.manuallyUnlocked = false;
}
/* Reversible unlock: clicking a FINALIZED budget returns it to editable. Without
   manuallyUnlocked, a past-dated day would just get immediately re-closed by
   autoCloseBudgets() on the very next render — this flag pauses that auto-close
   until the user explicitly finalizes it again. */
function reopenBudget(b){
  b.closed = false;
  b.manuallyUnlocked = true;
}

function autoCloseBudgets(){
  const t = todayStr();
  state.budgets.forEach(b=>{
    if(!b.closed && !b.manuallyUnlocked && b.date < t){ b.closed = true; }
  });
}

/* Validate a (new or edited) future-dated budget against currently available Total
   Money — checked chronologically: the cumulative total of all future, non-cancelled
   budgets up to and including this date must not exceed what's currently available.
   Only applies to dates after today; today/past budgets are unaffected (they're
   evaluated against actual spending, not planned future totals). */
function validateFutureBudgetAmount(date, amount, excludeId){
  const t = todayStr();
  if(date<=t) return {ok:true};
  const available = totalMoney();
  const priorFuture = state.budgets
    .filter(b=>b.date>t && b.date<=date && !b.cancelled && b.id!==excludeId)
    .reduce((s,b)=>s+b.amount,0);
  const cumulative = round2(priorFuture + amount);
  if(cumulative > available+0.001){
    return {ok:false, msg:`Not enough available money. Planned budgets through ${niceDate(date)} would total ${fmt(cumulative)}, but only ${fmt(available)} is available.`};
  }
  return {ok:true};
}

/* Re-checks all future budgets chronologically (nearest day first) whenever Total
   Money may have changed, cancelling — and notifying about — any that are no longer
   supported. Once cancelled, a budget stays cancelled (it never silently resurfaces
   if money later increases); the user can create a new one instead. Idempotent: only
   budgets not already flagged get cancelled, so this can safely run on every render()
   without repeat notifications. */
function enforceFutureBudgetLimits(){
  const t = todayStr();
  const available = totalMoney();
  const future = state.budgets.filter(b=>b.date>t && !b.cancelled).sort((a,c)=>a.date<c.date?-1:1);
  let cumulative = 0;
  let firstCancelled = null;
  future.forEach(b=>{
    cumulative = round2(cumulative + b.amount);
    if(cumulative > available+0.001){
      b.cancelled = true;
      if(!firstCancelled) firstCancelled = b;
    }
  });
  if(firstCancelled){
    showToast(`Future budget cancelled: ${niceDate(firstCancelled.date)} (${fmt(firstCancelled.amount)})`);
  }
}

/* Keeps Credits and both Debt pools in sync, always re-derived live from the
   underlying budgets/expenses rather than incremented — so editing a historical day
   (adding a forgotten expense, correcting an amount, retyping Budgeted<->Non-Budgeted)
   can never create duplicate Credits or duplicate debt; it just recomputes.

   CRITICAL: a budget is a spending PLAN, not money. Assigning ₱150 to a school day —
   whether that day is today, still in progress, or in the future — must never itself
   add to Total Money, and its excess/overrun must never be finalized into real Extra
   Money or Overrun Debt until that day has actually ended. "Ended" means the budget
   is closed — which happens automatically once its date is in the past (see
   autoCloseBudgets(), always run before this) or when the user finalizes it early.
   Until then, budgetResult() can still be read live for an in-progress preview (e.g.
   "so far" figures on Dashboard/Budget), but that preview never touches extraTx or
   debts here.

   Two independent sources feed the auto-generated Debt types (a third type, Normal
   Debt, is entered manually and is untouched by this function — see addNormalDebt()):
     - OVERRUN DEBT: one record per CLOSED budget day, amount = that day's final
       overrun. Only Budgeted expenses count toward this — see spentForBudget()/
       budgetResult(). Payable using Credits only.
     - PERSONAL DEBT: one record per Non-Budgeted + "Wants" expense, amount = that
       expense's amount, 1:1, applied immediately since it's a real decision to spend
       beyond a need — this one is not date-gated. A Wants expense does NOT deduct
       money from its source directly; instead the full amount becomes Personal Debt,
       payable using Credits only.
     - Non-Budgeted expenses in any OTHER category (Needs, Food, etc.) are a plain
       direct deduction from their selected money source — no debt, no budget effect. */
function syncDebtsAndExtras(){
  // --- Budgeted-day driven: Credits + Overrun Debt (closed days only) ---
  state.budgets.forEach(b=>{
    const {excess, overrun} = budgetResult(b);
    const finalized = !!b.closed; // day has actually ended (or was finalized early)

    let ex = state.extraTx.find(x=>x.relatedBudgetId===b.id);
    if(finalized && excess > 0.001){
      if(ex){ ex.amount = excess; }
      else {
        ex = {id:uid(), amount:excess, source:'Budget Excess', date:b.date, relatedBudgetId:b.id};
        state.extraTx.unshift(ex);
        addHistory('extra', 'Budget Excess → Credits', excess, {budgetId:b.id}, b.date);
      }
    } else if(ex){
      // Not finalized (or no longer in excess) — this budget must not be holding an
      // Credits contribution yet.
      state.extraTx = state.extraTx.filter(x=>x.id!==ex.id);
    }

    let d = state.debts.find(x=>x.relatedBudgetId===b.id && x.debtType==='overrun');
    const totalPaid = d ? round2(state.debtPayments.filter(p=>p.debtId===d.id).reduce((s,p)=>s+p.amount,0)) : 0;
    if(finalized && overrun > 0.001){
      if(d){
        d.amount = round2(Math.max(overrun, totalPaid));
        d.remaining = round2(Math.max(0, overrun-totalPaid));
        d.status = d.remaining<=0.001 ? 'paid' : 'active';
      } else {
        d = {id:uid(), amount:overrun, remaining:overrun, dateCreated:b.date, status:'active', debtType:'overrun', relatedBudgetId:b.id};
        state.debts.unshift(d);
        addHistory('debt', 'Budget Overrun → Overrun Debt', overrun, {budgetId:b.id}, b.date);
      }
    } else if(d){
      if(totalPaid > 0.001){
        d.amount = totalPaid; d.remaining = 0; d.status = 'paid';
      } else {
        state.debts = state.debts.filter(x=>x.id!==d.id);
      }
    }
  });

  // --- Non-Budgeted + Wants driven: Personal Debt, 1:1, never touches Credits ---
  state.expenses.filter(e=>e.expenseType===NON_BUDGETED && e.category==='Wants').forEach(e=>{
    let d = state.debts.find(x=>x.relatedExpenseId===e.id && x.debtType==='personal');
    const totalPaid = d ? round2(state.debtPayments.filter(p=>p.debtId===d.id).reduce((s,p)=>s+p.amount,0)) : 0;
    const amt = e.amount;
    if(d){
      d.amount = round2(Math.max(amt, totalPaid));
      d.remaining = round2(Math.max(0, amt-totalPaid));
      d.status = d.remaining<=0.001 ? 'paid' : 'active';
    } else {
      d = {id:uid(), amount:amt, remaining:amt, dateCreated:e.date, status:'active', debtType:'personal', relatedExpenseId:e.id};
      state.debts.unshift(d);
      addHistory('debt', 'Non-Budgeted Want → Personal Debt', amt, {expenseId:e.id}, e.date);
    }
  });
  // Clean up Personal Debt whose source expense was deleted, or was retyped away from
  // Non-Budgeted+Wants (e.g. edited to Budgeted, or category changed) — mirrors the
  // overrun cleanup above. Manually-entered Normal (borrowed) debts are untouched here.
  const activeWantsIds = new Set(state.expenses.filter(e=>e.expenseType===NON_BUDGETED && e.category==='Wants').map(e=>e.id));
  state.debts = state.debts.filter(d=>{
    if(d.debtType!=='personal' || activeWantsIds.has(d.relatedExpenseId)) return true;
    const totalPaid = round2(state.debtPayments.filter(p=>p.debtId===d.id).reduce((s,p)=>s+p.amount,0));
    if(totalPaid > 0.001){ d.amount = totalPaid; d.remaining = 0; d.status = 'paid'; d.relatedExpenseId = null; return true; }
    return false;
  });
}

function addExpense(data){
  const amount = round2(parseFloat(data.amount));
  const expenseType = (data.expenseType===BUDGETED || data.expenseType===SURPLUS) ? data.expenseType : NON_BUDGETED;
  // Architecture rule: only a Budgeted expense ever carries a budgetId.
  let budgetId = expenseType===BUDGETED ? (data.budgetId || null) : null;
  const exp = {
    id:uid(), amount, date:data.date, category:data.category, place:data.place||'',
    item:data.item||'', notes:data.notes||'', photo:data.photo||null, source:data.source,
    expenseType, budgetId,
    createdAt: Date.now()
  };
  state.expenses.unshift(exp);
  addHistory('expense', `${data.category}${data.place? ' / '+data.place:''}`, -amount, {source:data.source, expenseId:exp.id, expenseType}, data.date);
  syncDebtsAndExtras();
  return exp;
}

function payDebt(amount, source, debtType){
  amount = round2(amount);
  // Overrun Debt and Personal Debt can only ever be paid down using Credits —
  // enforced here as well as in the UI. Normal (borrowed) Debt uses payNormalDebt().
  if(source !== 'extra') return {ok:false, msg:'This debt can only be paid using Credits.'};
  if(debtType!=='overrun' && debtType!=='personal') return {ok:false, msg:'Choose which debt to pay.'};
  if(!amount || amount<=0) return {ok:false, msg:'Enter a valid amount.'};
  const bal = computeAccountBalance('extra');
  if(amount > bal+0.001) return {ok:false, msg:'Not enough Credits balance.'};
  const label = debtType==='overrun' ? 'Overrun Debt' : 'Personal Debt';
  const owed = debtType==='overrun' ? totalOverrunDebt() : totalPersonalDebt();
  if(amount > owed+0.001) return {ok:false, msg:`That's more than the outstanding ${label} (${fmt(owed)}).`};
  let remainingToPay = amount;
  // Oldest debts of the chosen type are settled first.
  const activeDebts = state.debts.filter(d=>d.status==='active' && d.debtType===debtType).sort((a,b)=>a.dateCreated<b.dateCreated?-1:1);
  for(const d of activeDebts){
    if(remainingToPay<=0) break;
    const pay = Math.min(d.remaining, remainingToPay);
    d.remaining = round2(d.remaining-pay);
    remainingToPay = round2(remainingToPay-pay);
    if(d.remaining<=0.001){ d.remaining=0; d.status='paid'; }
    state.debtPayments.unshift({id:uid(), debtId:d.id, amount:pay, source:'extra', date:todayStr(), debtType});
  }
  addHistory('debtpay', `${label} Payment → Credits`, -amount, {source:'extra', debtType});
  return {ok:true};
}

/* Normal Debt = money manually borrowed from another person. Entered directly by the
   user (not derived from any expense), and is untouched by syncDebtsAndExtras(). */
function addNormalDebt(data){
  const amount = round2(parseFloat(data.amount));
  const debt = {
    id:uid(), amount, remaining:amount, dateCreated:data.date||todayStr(), status:'active',
    debtType:'borrowed', person:data.person||'', reason:data.reason||'', photo:data.photo||null,
    createdAt:Date.now()
  };
  state.debts.unshift(debt);
  addHistory('debt', `Borrowed from ${data.person||'someone'}`, amount, {debtType:'borrowed'}, debt.dateCreated);
  return debt;
}

/* Normal (borrowed) Debt is paid using Allowance or Scholar Allowance — never Extra
   Money. Each borrowed debt is a distinct person/record, so payment targets one
   specific debt rather than pooling oldest-first like Overrun/Personal Debt. */
function payNormalDebt(debtId, amount, source){
  amount = round2(amount);
  const g = nodeGroup(source);
  if(g!=='funds' && g!=='scholar') return {ok:false, msg:'Normal Debt can only be paid using Funds or Scholar Allowance.'};
  const d = state.debts.find(x=>x.id===debtId && x.debtType==='borrowed');
  if(!d) return {ok:false, msg:'Debt not found.'};
  if(!amount || amount<=0) return {ok:false, msg:'Enter a valid amount.'};
  if(amount > d.remaining+0.001) return {ok:false, msg:`That's more than the outstanding amount (${fmt(d.remaining)}).`};
  const bal = computeAccountBalance(source);
  if(amount > bal+0.001) return {ok:false, msg:`Insufficient balance.`};
  d.remaining = round2(d.remaining-amount);
  if(d.remaining<=0.001){ d.remaining=0; d.status='paid'; }
  state.debtPayments.unshift({id:uid(), debtId:d.id, amount, source, date:todayStr(), debtType:'borrowed'});
  addHistory('debtpay', `Normal Debt Payment (${d.person||'—'}) → ${nodeLabel(source)}`, -amount, {source, debtType:'borrowed'});
  return {ok:true};
}

/* Edit a Normal (borrowed) Debt record — amount, person, date, reason, photo. If the
   amount changes, remaining is recalculated against whatever has already been paid. */
function editNormalDebt(id, data){
  const d = state.debts.find(x=>x.id===id && x.debtType==='borrowed');
  if(!d) return {ok:false, msg:'Debt not found.'};
  if(!canEdit(d.createdAt)) return {ok:false, msg:'The one-month editing period for this debt has expired.'};
  const newAmount = round2(parseFloat(data.amount));
  if(!newAmount || newAmount<=0) return {ok:false, msg:'Enter a valid amount.'};
  if(!data.person || !data.person.trim()) return {ok:false, msg:'Enter who you borrowed from.'};
  const totalPaid = round2(state.debtPayments.filter(p=>p.debtId===d.id).reduce((s,p)=>s+p.amount,0));
  d.amount = newAmount;
  d.remaining = round2(Math.max(0, newAmount-totalPaid));
  d.status = d.remaining<=0.001 ? 'paid' : 'active';
  d.dateCreated = data.date || d.dateCreated;
  d.person = data.person.trim();
  d.reason = (data.reason||'').trim();
  if(data.photo!==undefined) d.photo = data.photo;
  return {ok:true};
}

/* Delete a Normal (borrowed) Debt record entirely. If payments were already made
   toward it, deleting the debt also removes those payment records — which, because
   Allowance/Scholar balances are always derived live, effectively returns that money
   to its source (there is nothing left to justify the earlier deduction). */
function deleteNormalDebtTx(id, force){
  const d = state.debts.find(x=>x.id===id && x.debtType==='borrowed');
  if(!d) return {ok:false, msg:'Debt not found.'};
  if(!canEdit(d.createdAt)) return {ok:false, msg:'The one-month deletion period for this debt has expired.'};
  const totalPaid = round2(state.debtPayments.filter(p=>p.debtId===id).reduce((s,p)=>s+p.amount,0));
  if(totalPaid>0.001 && !force){
    return {ok:false, needsForce:true, msg:`${fmt(totalPaid)} has already been paid toward this debt. Deleting it will also remove that payment record, returning the money to its source.`};
  }
  state.debtPayments = state.debtPayments.filter(p=>p.debtId!==id);
  state.debts = state.debts.filter(x=>x.id!==id);
  return {ok:true};
}

/* ============================= DELETION ============================= */
/* Deleting a transaction must remove its financial effect entirely, not just hide it.
   Because every balance is derived live from the underlying transaction arrays
   (see computeAccountBalance/budgetResult/syncDebtsAndExtras above), the correct way
   to reverse a transaction is simply to remove it from its source array and let every
   dependent value re-derive itself — never a compensating "reversal" entry.

   Before actually removing anything, we run the same removal against a throwaway
   deep-cloned copy of state ("trial run") so we can see whether it would push any
   account balance negative — i.e. whether money from this transaction has already
   been spent, transferred out, or otherwise committed elsewhere. If so, the caller
   can surface a clear warning instead of silently corrupting the ledger. */
function trialRun(mutator){
  const backup = JSON.parse(JSON.stringify(state));
  mutator();
  syncDebtsAndExtras();
  const nodes = [...fundsNodes(), ...scholarNodes(), 'extra'];
  const balances = {};
  nodes.forEach(n=>{ balances[n] = computeAccountBalance(n); });
  state = backup;
  return balances;
}

/* Funds / Scholar Allowance income deletion. Only the affected node's own balance
   can go negative from removing an income transaction (income never touches other
   nodes), so that's the only check needed. */
function deleteIncomeTx(id, force){
  const tx = state.incomeTx.find(x=>x.id===id);
  if(!tx) return {ok:false, msg:'Transaction not found.'};
  if(!canEdit(tx.createdAt)) return {ok:false, msg:'The one-month deletion period for this transaction has expired.'};
  const trial = trialRun(()=>{ state.incomeTx = state.incomeTx.filter(x=>x.id!==id); });
  if(!force && trial[tx.node] < -0.001){
    return {ok:false, needsForce:true, msg:`Deleting this brings ${nodeLabel(tx.node)} to ${fmt(trial[tx.node])} because some of this money has already been spent or transferred out.`};
  }
  state.incomeTx = state.incomeTx.filter(x=>x.id!==id);
  syncDebtsAndExtras();
  return {ok:true};
}

/* Expense deletion. Removing an expense only ever increases the balance of the
   account it was paid from (an outflow disappears). If it was a Budgeted expense,
   removing it can only ever increase a budget day's excess or decrease its overrun
   (less spending) — syncDebtsAndExtras already resolves any resulting Credits /
   Debt changes safely (see its own comments). Non-Budgeted expenses never touch the
   budget system in the first place, so their deletion is purely a money-source reversal.
   No additional negative-balance guard is required either way. */
function deleteExpenseTx(id){
  const exp = state.expenses.find(x=>x.id===id);
  if(!exp) return {ok:false, msg:'Expense not found.'};
  if(!canEdit(exp.createdAt)) return {ok:false, msg:'The one-month deletion period for this expense has expired.'};
  state.expenses = state.expenses.filter(x=>x.id!==id);
  syncDebtsAndExtras();
  return {ok:true};
}

/* Transfer deletion. Reversing a transfer decreases the "to" account's balance
   (its inflow disappears) — that's the account that may have already spent the
   money — while the "from" account only ever increases, so only "to" needs checking. */
function deleteTransferTx(id, force){
  const tx = state.transfers.find(x=>x.id===id);
  if(!tx) return {ok:false, msg:'Transfer not found.'};
  if(!canEdit(tx.createdAt)) return {ok:false, msg:'The one-month deletion period for this transfer has expired.'};
  const trial = trialRun(()=>{ state.transfers = state.transfers.filter(x=>x.id!==id); });
  if(!force && trial[tx.to] < -0.001){
    return {ok:false, needsForce:true, msg:`Deleting this transfer brings ${nodeLabel(tx.to)} to ${fmt(trial[tx.to])} because some of the transferred money has already been used.`};
  }
  state.transfers = state.transfers.filter(x=>x.id!==id);
  syncDebtsAndExtras();
  return {ok:true};
}

/* Budget deletion. A budget itself never held money, so there's no negative-balance
   risk from removing it. Two things need cleanup:
   1. Any expenses linked to it (budgetId) are unlinked and become Non-Budgeted —
      they remain real transactions, they just stop counting toward a budget limit.
   2. Any Credits / Overrun Debt already derived from this budget becomes
      orphaned once the budget is gone (syncDebtsAndExtras only updates entries for
      budgets that still exist), so we remove them explicitly here — preserving
      already-paid amounts, same as the existing personal-debt cleanup pattern. */
function deleteBudgetTx(id, force){
  const b = state.budgets.find(x=>x.id===id);
  if(!b) return {ok:false, msg:'Budget not found.'};
  if(!canEdit(b.createdAt)) return {ok:false, msg:'The one-month deletion period for this budget has expired.'};
  const linkedExpenses = state.expenses.filter(e=>e.budgetId===id);
  if(linkedExpenses.length && !force){
    return {ok:false, needsForce:true, msg:`This budget has ${linkedExpenses.length} linked expense(s). Deleting it will unlink them (they'll count as Non-Budgeted spending).`};
  }
  linkedExpenses.forEach(e=>{ e.budgetId=null; e.expenseType=NON_BUDGETED; });
  state.budgets = state.budgets.filter(x=>x.id!==id);
  const currentBudgetIds = new Set(state.budgets.map(x=>x.id));
  state.extraTx = state.extraTx.filter(x=>!x.relatedBudgetId || currentBudgetIds.has(x.relatedBudgetId));
  state.debts = state.debts.filter(d=>{
    if(d.debtType!=='overrun' || !d.relatedBudgetId || currentBudgetIds.has(d.relatedBudgetId)) return true;
    const totalPaid = round2(state.debtPayments.filter(p=>p.debtId===d.id).reduce((s,p)=>s+p.amount,0));
    if(totalPaid>0.001){ d.amount=totalPaid; d.remaining=0; d.status='paid'; d.relatedBudgetId=null; return true; }
    return false;
  });
  syncDebtsAndExtras();
  return {ok:true};
}

function calcAge(birthdate){
  if(!birthdate) return null;
  const b = parseDate(birthdate);
  const t = new Date();
  let age = t.getFullYear()-b.getFullYear();
  const m = t.getMonth()-b.getMonth();
  if(m<0 || (m===0 && t.getDate()<b.getDate())) age--;
  return age;
}
