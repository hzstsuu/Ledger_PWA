/* Recent Activity is derived LIVE from the actual source records every time it's
   built — never from a separately-stored log. This is the same "always derive, never
   incrementally stored" principle used for every balance/total elsewhere in the app
   (see computeAccountBalance, budgetResult, etc.), and it's what makes this correct:
   a record's date field here is read straight from state.expenses/incomeTx/etc., so
   editing an expense's date (or amount, or deleting it) is reflected immediately and
   automatically — there is no separate copy of the date that can go stale or drift
   from what the user actually set. */
function buildActivityFeed(limit){
  const items = [];
  state.incomeTx.forEach(x=>{
    items.push({type:'income', label:`${accountLabel(x.node)} Added — ${nodeLabel(x.node)}`, date:x.date, amount:x.amount, ts:x.createdAt||0, meta:{}});
  });
  state.expenses.forEach(e=>{
    items.push({type:'expense', label:`${e.category}${e.place? ' / '+e.place:''}`, date:e.date, amount:-e.amount, ts:e.createdAt||0, meta:{expenseType:e.expenseType}});
  });
  state.transfers.forEach(t=>{
    items.push({type:'transfer', label:`${nodeLabel(t.from)} → ${nodeLabel(t.to)}`, date:t.date, amount:t.amount, ts:t.createdAt||0, meta:{}});
  });
  state.extraTx.forEach(x=>{
    items.push({type:'extra', label:'Budget Excess → Credits', date:x.date, amount:x.amount, ts:0, meta:{}});
  });
  state.debts.forEach(d=>{
    const label = d.debtType==='overrun' ? 'Budget Overrun → Overrun Debt'
      : d.debtType==='personal' ? 'Non-Budgeted Want → Personal Debt'
      : `Borrowed from ${d.person||'someone'}`;
    items.push({type:'debt', label, date:d.dateCreated, amount:d.amount, ts:d.createdAt||0, meta:{debtType:d.debtType}});
  });
  state.debtPayments.forEach(p=>{
    const label = p.debtType==='overrun' ? 'Overrun' : p.debtType==='personal' ? 'Personal' : 'Normal';
    items.push({type:'debtpay', label:`${label} Debt Payment → ${accountLabel(p.source)}`, date:p.date, amount:-p.amount, ts:0, meta:{}});
  });
  return items
    .sort((a,b)=> b.date!==a.date ? (b.date>a.date?1:-1) : b.ts-a.ts)
    .slice(0, limit);
}

/* ============================= BUDGET ============================= */
function weekRangeData(dateStr){
  const start = startOfWeek(dateStr);
  const days = [...Array(7)].map((_,i)=>addDays(start,i));
  return days;
}
/* Expected budget for a set of days = the actually-configured budget amount for each
   configured school day, falling back to the current default only for school days that
   don't have a budget entry yet. isSchoolDay(d) already resolves per-date against the
   historical School Days configuration (see the config-history block above), so this
   naturally uses whichever configuration governed each individual date — a week or
   month that spans a School Days change correctly blends both configurations instead
   of applying the newest one across the board. */
function expectedForDays(days){
  return round2(days.reduce((sum,d)=>{
    if(!isSchoolDay(d)) return sum;
    const b = state.budgets.find(x=>x.date===d);
    return sum + (b ? b.amount : state.settings.defaultBudget);
  },0));
}
let budgetViewDate = null; // which day's card is currently shown/editable in the Budget tab

function budgetStatus(b){
  if(b.cancelled) return 'Cancelled';
  if(b.closed) return 'Finalized';
  const t = todayStr();
  if(b.date>t) return 'Upcoming';
  if(b.date===t) return 'Active';
  return 'Completed';
}
function budgetStatusColor(status){
  return status==='Cancelled' ? 'var(--debt)' : status==='Active' ? 'var(--accent-ink)' : status==='Upcoming' ? 'var(--scholar)' : status==='Finalized' ? 'var(--allowance)' : 'var(--ink-soft)';
}
function budgetPage(){
  const t = todayStr();
  if(!budgetViewDate) budgetViewDate = t;
  const viewBudget = state.budgets.find(b=>b.date===budgetViewDate);
  const viewRes = viewBudget ? budgetResult(viewBudget) : null;
  const nonBudgetedViewAmt = nonBudgetedSpentForDate(budgetViewDate);
  // A budget day's own editability (its amount/source, and finalizing it) follows the
  // same one-month window as everything else, keyed off when the budget entry was
  // first created — NOT off today's date, so yesterday's or last week's budget stays
  // fully editable, not locked the moment the calendar day ends.
  const viewEditable = viewBudget ? canEdit(viewBudget.createdAt) : true;

  const days = weekRangeData(budgetViewDate);
  const weekBudgets = state.budgets.filter(b=>days.includes(b.date));
  const expectedWeekly = expectedForDays(days);
  const actualWeekly = round2(weekBudgets.reduce((s,b)=>s+budgetResult(b).spent,0));
  const excessWeekly = round2(weekBudgets.reduce((s,b)=>s+budgetResult(b).excess,0));
  const overrunWeekly = round2(weekBudgets.reduce((s,b)=>s+budgetResult(b).overrun,0));
  const nonBudgetedWeekly = nonBudgetedSpentForDates(days);

  const mKey = monthKey(t);
  const monthDays = [...Array(daysInMonth(mKey))].map((_,i)=>`${mKey}-${String(i+1).padStart(2,'0')}`);
  const monthBudgets = state.budgets.filter(b=>monthKey(b.date)===mKey);
  const expectedMonthly = expectedForDays(monthDays);
  const actualMonthly = round2(monthBudgets.reduce((s,b)=>s+budgetResult(b).spent,0));
  const excessMonthly = round2(monthBudgets.reduce((s,b)=>s+budgetResult(b).excess,0));
  const overrunMonthly = round2(monthBudgets.reduce((s,b)=>s+budgetResult(b).overrun,0));
  const nonBudgetedMonthly = nonBudgetedSpentForDates(monthDays);
  const debtPaidMonthly = round2(state.debtPayments.filter(p=>monthKey(p.date)===mKey).reduce((s,p)=>s+p.amount,0));

  const history = state.budgets.slice(0,40);

  return `
  <div class="pagehead"><h1>Budget</h1><div class="sub">School-day budgeting, planned around your class schedule.</div></div>

  <div class="sectiontitle" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <span>Browse days</span>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" id="budget-prevweek">‹ Prev week</button>
      ${budgetViewDate!==t? `<button class="btn btn-ghost btn-sm" id="budget-today">Today</button>`:''}
      <button class="btn btn-ghost btn-sm" id="budget-nextweek">Next week ›</button>
      <input type="date" id="budget-datejump" value="${budgetViewDate}" style="border:1px solid var(--card-line);border-radius:9px;padding:6px 10px;font-size:12.5px;background:var(--paper);color:var(--ink)">
    </div>
  </div>
  <div class="weekstrip">
    ${days.map(d=>{
      const b = state.budgets.find(x=>x.date===d);
      const off = !isSchoolDay(d);
      const isToday = d===t;
      const isSelected = d===budgetViewDate;
      let icon='—', amt='';
      if(b){
        const r = budgetResult(b);
        icon = r.excess>0?'🟢':r.overrun>0?'🔴':'⚪';
        amt = fmt(r.spent);
      }
      return `<div class="wday ${off?'off':''} ${isToday?'today':''} ${isSelected?'selected':''}" data-day-select="${d}" style="cursor:pointer">
        <div class="wd-name">${WEEKDAYS[weekdayOf(d)]}</div>
        <div class="wd-status">${icon}</div>
        <div class="wd-amt">${amt}</div>
      </div>`;
    }).join('')}
  </div>

  <div class="card" style="margin-bottom:18px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap">
      <h3 style="margin:0">${budgetViewDate===t?"Today's Budget":'Budget'} — ${niceDate(budgetViewDate)}</h3>
      ${viewBudget? `<span class="chip" style="background:transparent;border:1px solid var(--card-line);color:${budgetStatusColor(budgetStatus(viewBudget))}">${budgetStatus(viewBudget)}</span>` : ''}
    </div>
    ${viewBudget? `
      <div class="grid grid-3" style="margin-bottom:12px">
        <div><div class="k" style="font-size:11px;color:var(--ink-soft);font-weight:700;text-transform:uppercase">Budget</div><div class="mono" style="font-size:18px;font-weight:600">${fmt(viewBudget.amount)}</div></div>
        <div><div class="k" style="font-size:11px;color:var(--ink-soft);font-weight:700;text-transform:uppercase">Budgeted Spent</div><div class="mono" style="font-size:18px;font-weight:600">${fmt(viewRes.spent)}</div></div>
        <div><div class="k" style="font-size:11px;color:var(--ink-soft);font-weight:700;text-transform:uppercase">${viewRes.overrun>0?'Overrun so far':'Excess so far'}</div><div class="mono" style="font-size:18px;font-weight:600;${viewRes.overrun>0?'color:var(--debt)':''}">${fmt(viewRes.overrun>0?viewRes.overrun:viewRes.excess)}</div></div>
      </div>
      ${nonBudgetedViewAmt>0? `<div class="helptext" style="margin-bottom:12px">Non-Budgeted spending: <strong class="mono" style="color:var(--ink)">${fmt(nonBudgetedViewAmt)}</strong> (not counted above)</div>`:''}
      ${viewBudget.closed ? `
        <button type="button" id="budget-reopen-day" class="chip allowance" style="border:none;font-size:12.5px;padding:6px 14px;${viewEditable?'cursor:pointer':'cursor:default;opacity:.7'}" ${viewEditable?'':'disabled'}>FINALIZED${viewEditable? ' · tap to edit':''}</button>
      ` : `
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${viewEditable? `<button class="btn btn-ghost btn-sm" id="budget-edit-day">Edit</button>` : ''}
        ${viewEditable? `<button class="btn btn-danger btn-sm" id="budget-delete-day">Delete</button>` : ''}
        ${viewEditable && !viewBudget.cancelled? `<button class="btn btn-accent btn-sm" id="budget-close-day">Finalize</button>`:''}
        ${!viewEditable? `<span class="expiredtag">Editing period expired</span>`:''}
      </div>
      `}
    ` : `
      <p style="color:var(--ink-soft);font-size:13.5px;margin-top:0">No budget set for this day yet.</p>
      <button class="btn btn-primary btn-sm" id="budget-create-day">Set budget for this day</button>
    `}
  </div>

  <div class="grid grid-2" style="margin-bottom:18px">
    <div class="card">
      <div class="sectiontitle" style="margin-top:0">Week of ${niceDate(days[0])}</div>
      ${budgetSummaryRows({expected:expectedWeekly, actual:actualWeekly, excess:excessWeekly, overrun:overrunWeekly, nonBudgeted:nonBudgetedWeekly})}
    </div>
    <div class="card">
      <div class="sectiontitle" style="margin-top:0">This month — ${parseDate(t+'').toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div>
      ${budgetSummaryRows({expected:expectedMonthly, actual:actualMonthly, excess:excessMonthly, overrun:overrunMonthly, nonBudgeted:nonBudgetedMonthly})}
      <div style="display:flex;justify-content:space-between;font-size:12.8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--card-line)">
        <span style="color:var(--ink-soft)">Debt paid this month</span><span class="mono" style="font-weight:600">${fmt(debtPaidMonthly)}</span>
      </div>
    </div>
  </div>

  <div class="sectiontitle">Budget history</div>
  <div class="tablewrap"><table>
    <thead><tr><th>Date</th><th>Budget</th><th>Spent</th><th>Result</th><th>Status</th></tr></thead>
    <tbody>
      ${history.length? history.map(b=>{
        const r = budgetResult(b);
        const status = budgetStatus(b);
        return `
        <tr>
          <td>${niceDate(b.date)}</td>
          <td>${fmt(b.amount)}</td>
          <td>${fmt(r.spent)}</td>
          <td>${r.excess>0? `<span class="tag-under">+${fmt(r.excess)}</span>` : r.overrun>0? `<span class="tag-over">−${fmt(r.overrun)}</span>`:'—'}</td>
          <td style="color:${budgetStatusColor(status)};font-weight:600">${status}</td>
        </tr>`;
      }).join('') : `<tr><td colspan="5" style="font-family:'Inter',sans-serif;color:var(--ink-faint);text-align:center;padding:20px">No budgets yet.</td></tr>`}
    </tbody>
  </table></div>
  `;
}
function budgetSummaryRows(d){
  return `
  <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px"><span style="color:var(--ink-soft)">Expected budget</span><span class="mono" style="font-weight:600">${fmt(d.expected)}</span></div>
  <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px"><span style="color:var(--ink-soft)">Budgeted spending</span><span class="mono" style="font-weight:600">${fmt(d.actual)}</span></div>
  <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px"><span style="color:var(--allowance)">Total excess</span><span class="mono" style="font-weight:600;color:var(--allowance)">${fmt(d.excess)}</span></div>
  <div style="display:flex;justify-content:space-between;font-size:13px;${d.nonBudgeted!=null?'margin-bottom:7px':''}"><span style="color:var(--debt)">Total overrun</span><span class="mono" style="font-weight:600;color:var(--debt)">${fmt(d.overrun)}</span></div>
  ${d.nonBudgeted!=null ? `<div style="display:flex;justify-content:space-between;font-size:13px;padding-top:7px;border-top:1px dashed var(--card-line)"><span style="color:var(--ink-soft)">Non-Budgeted spending</span><span class="mono" style="font-weight:600;color:var(--ink-soft)">${fmt(d.nonBudgeted)}</span></div>` : ''}
  `;
}

/* ============================= SPENDING ============================= */
function spendingPage(){
  const expenses = [...state.expenses].sort((a,b)=> b.date!==a.date ? (b.date>a.date?1:-1) : (b.createdAt||0)-(a.createdAt||0)).slice(0,60);
  const totalAll = round2(state.expenses.reduce((s,e)=>s+e.amount,0));
  const totalBudgeted = round2(state.expenses.filter(e=>e.expenseType===BUDGETED).reduce((s,e)=>s+e.amount,0));
  const totalNonBudgeted = round2(state.expenses.filter(e=>e.expenseType===NON_BUDGETED).reduce((s,e)=>s+e.amount,0));
  const totalSurplus = round2(state.expenses.filter(e=>e.expenseType===SURPLUS).reduce((s,e)=>s+e.amount,0));
  return `
  <div class="pagehead"><h1>Spending</h1><div class="sub">Every peso, where it went.</div></div>
  <div class="actionrow"><button class="btn btn-primary" id="spend-add">＋ Add Expense</button></div>

  <div class="grid grid-4" style="margin-bottom:18px">
    <div class="card"><div class="wlabel" style="color:var(--ink-soft)">Total Spending</div><div class="amount mono" style="font-size:22px;margin-top:6px">${fmt(totalAll)}</div></div>
    <div class="card"><div class="wlabel" style="color:var(--allowance)">Budgeted</div><div class="amount mono" style="font-size:22px;margin-top:6px">${fmt(totalBudgeted)}</div></div>
    <div class="card"><div class="wlabel" style="color:var(--ink-soft)">Non-Budgeted</div><div class="amount mono" style="font-size:22px;margin-top:6px">${fmt(totalNonBudgeted)}</div></div>
    <div class="card"><div class="wlabel" style="color:var(--extra)">Surplus</div><div class="amount mono" style="font-size:22px;margin-top:6px">${fmt(totalSurplus)}</div></div>
  </div>

  <div class="sectiontitle">All expenses</div>
  ${expenses.length? `<div class="receipt">${expenses.map(e=>`
    <div class="rline" style="cursor:default" data-expense-row="${e.id}">
      <div class="rl-left" data-expense="${e.id}" style="cursor:pointer">
        <div class="ricon" style="background:var(--paper);color:var(--ink-soft)">${categoryIcon(e.category)}</div>
        <div class="rl-txt"><div class="rl-title">${e.category}${e.place? ' · '+e.place:''}</div><div class="rl-sub">${niceDate(e.date)} · <span class="chip ${e.expenseType}" style="padding:1px 7px;font-size:10px">${expenseTypeLabel(e.expenseType)}</span> · ${e.source ? nodeLabel(e.source) : 'Personal Debt'}</div></div>
      </div>
      <div class="rline-actions">
        <div class="ramt neg">−${fmt(e.amount)}</div>
        ${canEdit(e.createdAt) ? `<button class="editbtn" data-edit-expense="${e.id}">Edit</button><button class="deletebtn" data-delete-expense="${e.id}">Delete</button>` : `<span class="expiredtag">Editing period expired</span>`}
      </div>
    </div>`).join('')}</div>` : `<div class="receipt"><div class="empty">No expenses recorded yet.</div></div>`}
  `;
}
function categoryIcon(cat){
  const m = {Food:'🍜', Transportation:'🚌', 'School Necessities':'📎', Needs:'🧺', Wants:'🎧'};
  return m[cat] || '•';
}

/* ============================= DEBT ============================= */
function extraMoneyHistoryList(){
  const gains = state.extraTx.map(x=>({title:'Budget Excess', sub:niceDate(x.date), amount:x.amount, sortDate:x.date, sortTs:0, pos:true}));
  const surplusUses = state.expenses.filter(e=>e.expenseType===SURPLUS).map(e=>({title:`Surplus — ${e.category}`, sub:niceDate(e.date), amount:e.amount, sortDate:e.date, sortTs:e.createdAt||0, pos:false}));
  const debtPays = state.debtPayments.filter(p=>p.source==='extra').map(p=>({title:`Debt payment`, sub:niceDate(p.date), amount:p.amount, sortDate:p.date, sortTs:0, pos:false}));
  return [...gains, ...surplusUses, ...debtPays].sort((a,b)=> b.sortDate!==a.sortDate ? (b.sortDate>a.sortDate?1:-1) : b.sortTs-a.sortTs).slice(0,20);
}

function variancePage(){
  const active = state.debts.filter(d=>d.status==='active');
  const byDateDesc = (a,b)=> b.dateCreated!==a.dateCreated ? (b.dateCreated>a.dateCreated?1:-1) : 0;
  const overrunActive = active.filter(d=>d.debtType==='overrun').sort(byDateDesc);
  const personalActive = active.filter(d=>d.debtType==='personal').sort(byDateDesc);
  const borrowedActive = active.filter(d=>d.debtType==='borrowed').sort(byDateDesc);
  const paid = [...state.debtPayments].sort((a,b)=> b.date!==a.date ? (b.date>a.date?1:-1) : 0).slice(0,20);
  const extraBal = computeAccountBalance('extra');
  const extraPayableTotal = round2(totalOverrunDebt()+totalPersonalDebt());
  const debtTypeLabel = (t)=> t==='overrun'?'Overrun':t==='personal'?'Personal':'Normal';
  const extraHistory = extraMoneyHistoryList();
  return `
  <div class="pagehead"><h1>Variance</h1><div class="sub">Track your credits and outstanding debts.</div></div>

  <div class="variance-grid">
    <div class="variance-col variance-col-credits">
      <div class="sectiontitle" style="margin-top:0">Credits</div>
      <div class="card" style="margin-bottom:10px">
        <div class="wlabel" style="color:var(--extra)">Total Credits</div>
        <div class="amount mono" style="font-size:30px;margin:6px 0">${fmt(extraBal)}</div>
        <div class="helptext">Not part of Total Money</div>
      </div>
      ${extraHistory.length? `<div class="receipt">${extraHistory.map(h=>`
        <div class="rline" style="cursor:default">
          <div class="rl-left">
            <div class="ricon" style="background:var(--extra-bg);color:var(--extra)">${h.pos?'✦':'−'}</div>
            <div class="rl-txt"><div class="rl-title">${h.title}</div><div class="rl-sub">${h.sub}</div></div>
          </div>
          <div class="ramt ${h.pos?'pos':'neg'}">${h.pos?'+':'−'}${fmt(h.amount)}</div>
        </div>`).join('')}</div>` : `<div class="receipt"><div class="empty">No Credits activity yet.</div></div>`}
    </div>

    <div class="variance-col variance-col-debt">
      <div class="sectiontitle" style="margin-top:0">Debt</div>
      <div class="debtsummary">
        <div class="debtsummary-total">
          <div class="eyebrow" style="color:rgba(255,255,255,.75)">Total Debt</div>
          <div class="amount mono nowrap-amount">${fmt(totalDebt())}</div>
        </div>
        <div class="debtsummary-split">
          <div class="debtsummary-chip"><span class="k">Overrun</span><span class="v mono">${fmt(totalOverrunDebt())}</span></div>
          <div class="debtsummary-chip"><span class="k">Personal</span><span class="v mono">${fmt(totalPersonalDebt())}</span></div>
          <div class="debtsummary-chip"><span class="k">Normal</span><span class="v mono">${fmt(totalBorrowedDebt())}</span></div>
        </div>
      </div>

      <div class="statusband flat" style="margin-bottom:16px">
        <div class="sb-title">Credits available</div>
        <div class="sb-figs"><div class="fig"><div class="v mono" style="font-size:18px">${fmt(extraBal)}</div></div></div>
        ${extraPayableTotal>0? `<button class="btn btn-danger btn-sm" id="debt-pay">Pay with Credits</button>`:''}
      </div>

      <div class="sectiontitle">Overrun Debt <span style="font-weight:400;text-transform:none;color:var(--ink-faint)">· Payable only with Credits</span></div>
      ${overrunActive.length? `<div class="receipt">${overrunActive.map(d=>`
        <div class="rline" style="cursor:default">
          <div class="rl-left">
            <div class="ricon" style="background:var(--debt-bg);color:var(--debt)">▲</div>
            <div class="rl-txt"><div class="rl-title">Overrun from ${niceDate(d.dateCreated)}</div><div class="rl-sub">Original ${fmt(d.amount)}</div></div>
          </div>
          <div class="ramt debtc">${fmt(d.remaining)}</div>
        </div>`).join('')}</div>` : `<div class="receipt"><div class="empty">No active Overrun Debt.</div></div>`}

      <div class="sectiontitle">Personal Debt <span style="font-weight:400;text-transform:none;color:var(--ink-faint)">· Payable only with Credits</span></div>
      ${personalActive.length? `<div class="receipt">${personalActive.map(d=>`
        <div class="rline" style="cursor:default">
          <div class="rl-left">
            <div class="ricon" style="background:var(--debt-bg);color:var(--debt)">●</div>
            <div class="rl-txt"><div class="rl-title">Wants expense — ${niceDate(d.dateCreated)}</div><div class="rl-sub">Original ${fmt(d.amount)}</div></div>
          </div>
          <div class="ramt debtc">${fmt(d.remaining)}</div>
        </div>`).join('')}</div>` : `<div class="receipt"><div class="empty">No active Personal Debt.</div></div>`}

      <div class="sectiontitle" style="display:flex;justify-content:space-between;align-items:center">
        <span>Normal Debt <span style="font-weight:400;text-transform:none;color:var(--ink-faint)">· Payable with Funds or Scholar Allowance</span></span>
        <button class="btn btn-ghost btn-sm" id="debt-add-normal">＋ Add</button>
      </div>
      ${borrowedActive.length? `<div class="receipt">${borrowedActive.map(d=>`
        <div class="rline" style="cursor:default">
          <div class="rl-left" data-normal-detail="${d.id}" style="cursor:pointer">
            <div class="ricon" style="background:var(--debt-bg);color:var(--debt)">◆</div>
            <div class="rl-txt"><div class="rl-title">${d.person||'Someone'}${d.reason? ' · '+d.reason:''}</div><div class="rl-sub">${niceDate(d.dateCreated)} · Original ${fmt(d.amount)}</div></div>
          </div>
          <div class="rline-actions">
            <div class="ramt debtc">${fmt(d.remaining)}</div>
            <button class="btn btn-danger btn-sm" data-pay-normal="${d.id}">Pay</button>
          </div>
        </div>`).join('')}</div>` : `<div class="receipt"><div class="empty">No active Normal Debt.</div></div>`}

      <div class="sectiontitle">Payment history</div>
      ${paid.length? `<div class="receipt">${paid.map(p=>`
        <div class="rline" style="cursor:default">
          <div class="rl-left">
            <div class="ricon" style="background:var(--allowance-bg);color:var(--allowance)">✓</div>
            <div class="rl-txt"><div class="rl-title">${debtTypeLabel(p.debtType)} Debt — paid from ${accountLabel(p.source)}</div><div class="rl-sub">${niceDate(p.date)}</div></div>
          </div>
          <div class="ramt pos">${fmt(p.amount)}</div>
        </div>`).join('')}</div>` : `<div class="receipt"><div class="empty">No payments made yet.</div></div>`}
    </div>
  </div>
  `;
}

/* ============================= INSIGHTS ============================= */
function insightsPage(){
  const t = todayStr();
  const mKey = monthKey(t);
  const monthExpenses = state.expenses.filter(e=>monthKey(e.date)===mKey);
  const byCat = {};
  monthExpenses.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+e.amount; });
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat = catEntries.length? catEntries[0][1] : 1;
  const totalSpentMonth = round2(monthExpenses.reduce((s,e)=>s+e.amount,0));
  const budgetedSpentMonth = round2(monthExpenses.filter(e=>e.expenseType===BUDGETED).reduce((s,e)=>s+e.amount,0));
  const nonBudgetedSpentMonth = round2(monthExpenses.filter(e=>e.expenseType===NON_BUDGETED).reduce((s,e)=>s+e.amount,0));

  const monthBudgets = state.budgets.filter(b=>monthKey(b.date)===mKey && b.closed);
  const results = monthBudgets.map(b=>budgetResult(b));
  const underCount = results.filter(r=>r.excess>0).length;
  const overCount = results.filter(r=>r.overrun>0).length;
  const exactCount = monthBudgets.length-underCount-overCount;

  return `
  <div class="sub" style="margin-bottom:16px">${parseDate(t).toLocaleDateString('en-US',{month:'long',year:'numeric'})} at a glance.</div>

  <div class="grid grid-3" style="margin-bottom:18px">
    <div class="card"><div class="wlabel" style="color:var(--ink-soft)">Spent this month</div><div class="amount mono" style="font-size:22px;margin-top:6px">${fmt(totalSpentMonth)}</div></div>
    <div class="card"><div class="wlabel" style="color:var(--allowance)">Under-budget days</div><div class="amount mono" style="font-size:22px;margin-top:6px">${underCount}</div></div>
    <div class="card"><div class="wlabel" style="color:var(--debt)">Over-budget days</div><div class="amount mono" style="font-size:22px;margin-top:6px">${overCount}</div></div>
  </div>

  <div class="grid grid-2" style="margin-bottom:18px">
    <div class="card"><div class="wlabel" style="color:var(--allowance)">Budgeted spending</div><div class="amount mono" style="font-size:22px;margin-top:6px">${fmt(budgetedSpentMonth)}</div></div>
    <div class="card"><div class="wlabel" style="color:var(--ink-soft)">Non-Budgeted spending</div><div class="amount mono" style="font-size:22px;margin-top:6px">${fmt(nonBudgetedSpentMonth)}</div></div>
  </div>

  <div class="sectiontitle">Spending by category</div>
  <div class="card">
    ${catEntries.length? catEntries.map(([cat,amt])=>`
      <div class="barrow">
        <div class="brtop"><span class="cname">${categoryIcon(cat)} ${cat}</span><span class="camt">${fmt(amt)}</span></div>
        <div class="bartrack"><div class="barfill" style="width:${Math.max(4,(amt/maxCat)*100)}%"></div></div>
      </div>
    `).join('') : `<div class="empty">No spending recorded this month yet.</div>`}
  </div>

function wireInlineAddContact(addBtn, kind){
  addBtn.onclick = ()=>{
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;gap:6px;align-items:center;margin-top:6px;width:100%;flex-wrap:wrap';
    const inputType = kind==='email' ? 'email' : 'tel';
    const placeholder = kind==='email' ? 'name@example.com' : '09XX XXX XXXX';
    wrap.innerHTML = `
      <input type="${inputType}" placeholder="${placeholder}" style="flex:1;min-width:140px;border:1px solid var(--card-line);border-radius:10px;padding:7px 10px;font-size:13px;background:var(--paper);color:var(--ink)">
      <button type="button" class="btn btn-primary btn-sm">Add</button>
      <button type="button" class="btn btn-ghost btn-sm">Cancel</button>
    `;
    addBtn.replaceWith(wrap);
    const input = wrap.querySelector('input');
    const [saveBtn, cancelBtn] = wrap.querySelectorAll('button');
    input.focus();
    const doSave = ()=>{
      const val = input.value.trim();
      if(!val){ input.focus(); return; }
      if(!appMeta.profile) appMeta.profile = {};
      const key = kind==='email' ? 'emails' : 'phones';
      if(!appMeta.profile[key]) appMeta.profile[key] = [];
      if(appMeta.profile[key].some(x=>x.toLowerCase()===val.toLowerCase())){
        showToast(`That ${kind==='email'?'email':'number'} is already added`); input.focus(); return;
      }
      appMeta.profile[key].push(val);
      scheduleSaveMeta();
      render();
    };
    saveBtn.onclick = doSave;
    input.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); doSave(); } else if(e.key==='Escape'){ render(); } };
    cancelBtn.onclick = ()=>render();
  };
}
function removeContactEntry(kind, index){
  if(!appMeta.profile) return;
  const key = kind==='email' ? 'emails' : 'phones';
  if(!appMeta.profile[key] || !appMeta.profile[key].length) return;
  appMeta.profile[key].splice(index,1);
  scheduleSaveMeta(); render(); showToast(`${kind==='email'?'Email':'Number'} removed`);
}

/* ---- Money-source pickers ------------------------------------------------------

function noBanksHTML(group){
  return `<div class="srcempty">

function wireManageSourceLinks(container){

/* When editing a record that was paid from a since-removed bank, show that bank as the
   (selected) current value instead of pretending nothing is chosen. */
function removedNodePill(node){
  return `<button type="button" class="radiopill sel" data-node="${node}">${escapeHTML(nodeLabel(node))} (removed) · ${fmt(computeAccountBalance(node))}</button>`;
}

/* Two-tier money-node picker: choose Funds vs Scholar Allowance, then the specific
   node within that group (Cash on Hand + Funds E-Banks, or Scholar E-Banks).
   Credits is never offered here — it's not a valid expense/transfer/debt-payment
   funding source; it only ever moves via Variance (Surplus expenses, debt payoffs).
   `group` is passed explicitly by the caller so "Scholar Allowance" can stay selected
   even when it has no banks (and therefore no selected node yet).
   Renders `${idPrefix}-group` (the Funds/Scholar toggle) followed by `${idPrefix}-node`
   (the node list) — call wireMoneyNodePicker() after inserting it into the DOM. */
function moneyNodePickerHTML(selectedNode, idPrefix, groupArg){
  const g0 = selectedNode ? nodeGroup(selectedNode) : null;
  const group = groupArg || ((g0==='funds'||g0==='scholar') ? g0 : 'funds');
  const groupHTML = `<div class="radiogroup" id="${idPrefix}-group">
    <button type="button" class="radiopill ${group==='funds'?'sel':''}" data-group="funds">Funds</button>
    <button type="button" class="radiopill ${group==='scholar'?'sel':''}" data-group="scholar">Scholar Allowance</button>
  </div>`;
  const banks = group==='funds' ? activeFundsBanks() : activeScholarBanks();
  const prefix = group==='funds' ? 'fbank:' : 'sbank:';
  const removedSel = (selectedNode && selectedNode.startsWith(prefix) && !nodeIsActive(selectedNode)) ? removedNodePill(selectedNode) : '';
  const bankPills = banks.map(b=>`<button type="button" class="radiopill ${selectedNode===prefix+b.id?'sel':''}" data-node="${prefix}${b.id}">${escapeHTML(b.name)} · ${fmt(computeAccountBalance(prefix+b.id))}</button>`).join('');
  let nodeHTML;
  if(group==='funds'){
    nodeHTML = `<div class="radiogroup" id="${idPrefix}-node" style="margin-top:8px">
      <button type="button" class="radiopill ${selectedNode==='cash'?'sel':''}" data-node="cash">Cash on Hand · ${fmt(computeAccountBalance('cash'))}</button>
      ${removedSel}${bankPills}
    </div>`;
  } else if(!banks.length && !removedSel){
    nodeHTML = `<div id="${idPrefix}-node" style="margin-top:8px">${noBanksHTML('scholar')}</div>`;
  } else {
    nodeHTML = `<div class="radiogroup" id="${idPrefix}-node" style="margin-top:8px">${removedSel}${bankPills}</div>`;
  }
  return groupHTML + nodeHTML;
}
/* onGroupChange(group) fires when the Funds/Scholar toggle changes to the OTHER group;
   onNodeChange(node) fires when a specific node is chosen. */
function wireMoneyNodePicker(idPrefix, onGroupChange, onNodeChange){
  document.getElementById(idPrefix+'-group').querySelectorAll('[data-group]').forEach(b=>{
    b.onclick = ()=>{ if(b.classList.contains('sel')) return; onGroupChange(b.dataset.group); };
  });
  const nodeContainer = document.getElementById(idPrefix+'-node');
  if(!nodeContainer) return;
  nodeContainer.querySelectorAll('[data-node]').forEach(b=>{
    b.onclick = ()=> onNodeChange(b.dataset.node);
  });
  wireManageSourceLinks(nodeContainer);
}
/* Node-only picker for a group that's already fixed (e.g. the "Add Funds" modal,
   where the group is implied by which button the user clicked) — no Funds/Scholar
   toggle, just the specific-node choices for that one group. */
function moneyNodeOnlyHTML(group, selectedNode, idPrefix, fundsType){
  if(group==='funds'){
    const type = fundsType || (selectedNode && selectedNode.startsWith('fbank:') ? 'emoney' : 'cash');
    let html = `<div class="radiogroup" id="${idPrefix}-type">
      <button type="button" class="radiopill ${type==='cash'?'sel':''}" data-type="cash">Cash on Hand</button>
      <button type="button" class="radiopill ${type==='emoney'?'sel':''}" data-type="emoney">E-Money</button>
    </div>`;
    if(type==='emoney'){
      const banks = activeFundsBanks();
      html += banks.length
        ? `<div class="radiogroup" id="${idPrefix}-node" style="margin-top:8px">
            ${banks.map(b=>`<button type="button" class="radiopill ${selectedNode==='fbank:'+b.id?'sel':''}" data-node="fbank:${b.id}">${escapeHTML(b.name)}</button>`).join('')}
          </div>`
        : `<div id="${idPrefix}-node" style="margin-top:8px">${noBanksHTML('funds')}</div>`;
    }
    return html;
  }
  const banks = activeScholarBanks();
  return banks.length
    ? `<div class="radiogroup" id="${idPrefix}-node">
        ${banks.map(b=>`<button type="button" class="radiopill ${selectedNode==='sbank:'+b.id?'sel':''}" data-node="sbank:${b.id}">${escapeHTML(b.name)}</button>`).join('')}
      </div>`
    : `<div id="${idPrefix}-node">${noBanksHTML('scholar')}</div>`;
}
function wireMoneyNodeOnly(idPrefix, group, onNodeChange, onTypeChange){
  if(group==='funds'){
    const typeContainer = document.getElementById(idPrefix+'-type');
    if(typeContainer){
      typeContainer.querySelectorAll('[data-type]').forEach(b=>{
        b.onclick = ()=>{ if(b.classList.contains('sel')) return; onTypeChange(b.dataset.type); };
      });

  }
  const nodeContainer = document.getElementById(idPrefix+'-node');
  if(!nodeContainer) return;
  nodeContainer.querySelectorAll('[data-node]').forEach(b=>{
    b.onclick = ()=> onNodeChange(b.dataset.node);
  });
  wireManageSourceLinks(nodeContainer);
}

/* Generic "verify PIN, then proceed" gate — used wherever a sensitive settings
   screen (like Account Recovery) shouldn't be reachable without re-entering the PIN,
   even though the app itself is already unlocked for this session. onVerified()
   fires only after a correct PIN; the modal stays open and shows an error on a wrong
   attempt, same UX as every other PIN entry in the app. */
function mountVerifyPin(container, {title, sub, onVerified}){
  let buffer='', errorMsg='';
  function draw(){
    container.innerHTML = `
      <div class="gatecard" style="box-shadow:none;border:none;padding:4px 0;">
        <h1 class="gate-title" style="font-size:19px">${title}</h1>
        <p class="gate-sub">${sub}</p>
        ${pinDotsHTML(buffer)}
        <div class="pin-error">${errorMsg}</div>
        ${keypadHTML()}
      </div>`;
    container.querySelectorAll('.keypadbtn').forEach(b=>{
      b.onclick = ()=>{
        const k = b.dataset.key;
        if(k==='back'){ buffer = buffer.slice(0,-1); errorMsg=''; draw(); return; }
        if(buffer.length>=4) return;
        errorMsg=''; buffer += k; draw();
        if(buffer.length===4){
          setTimeout(async ()=>{
            const ok = await verifyPin(buffer);
            if(ok){ onVerified(); }
            else { errorMsg='Incorrect PIN. Please try again.'; buffer=''; draw(); }
          }, 120);
        }
      };
    });
  }
  draw();
}
function modalVerifyPinThen(onVerified, title, sub){
  openModal(`<button class="closex" id="m-close">✕</button><div id="pinflow-verify-container"></div>`);
  document.getElementById('m-close').onclick = closeModal;
  mountVerifyPin(document.getElementById('pinflow-verify-container'), {
    title: title || 'Enter PIN',
    sub: sub || 'Confirm your PIN to continue.',
    onVerified
  });
}

/* Changing the PIN always verifies the CURRENT PIN first — someone with the app
   already unlocked shouldn't be able to silently swap in a new PIN without knowing
   the old one. Only once that verifies does it hand off to the normal two-step
   (enter, confirm) capture for the new PIN via mountPinFlow(). */
function mountOldPinThenNewPin(container){
  let buffer='', errorMsg='';
  function draw(){
    container.innerHTML = `
      <div class="gatecard" style="box-shadow:none;border:none;padding:4px 0;">
        <h1 class="gate-title" style="font-size:19px">Enter Current PIN</h1>
        <p class="gate-sub">Confirm your current PIN before setting a new one.</p>
        ${pinDotsHTML(buffer)}
        <div class="pin-error">${errorMsg}</div>
        ${keypadHTML()}
      </div>`;
    container.querySelectorAll('.keypadbtn').forEach(b=>{
      b.onclick = ()=>{
        const k = b.dataset.key;
        if(k==='back'){ buffer = buffer.slice(0,-1); errorMsg=''; draw(); return; }
        if(buffer.length>=4) return;
        errorMsg=''; buffer += k; draw();
        if(buffer.length===4){
          setTimeout(async ()=>{
            const ok = await verifyPin(buffer);
            if(ok){
              mountPinFlow(container, {
                title:'Create New PIN',
                sub:'Enter a new 4-digit PIN.',
                onSuccess: async (pin)=>{
                  await setPin(pin);
                  closeModal();
                  showToast('PIN updated');
                }
              });
            } else {
              errorMsg='Incorrect current PIN. Please try again.'; buffer=''; draw();
            }
          }, 120);
        }
      };
    });
  }
  draw();
}

/* Removing a School Days history entry entirely. Guarded the same way as editing it
   (7-day window from when it was set), plus a floor of at least one remaining
   config — there must always be something covering every date, including dates
   before the very first version. */
function deleteSchoolDayConfig(id){
  const cfg = state.schoolDayConfigs.find(c=>c.id===id);
  if(!cfg) return;
  if(!canEditSchoolDayConfig(cfg.createdAt)){ showToast('The 7-day editing period for this entry has expired'); return; }
  if(state.schoolDayConfigs.length<=1){ showToast('At least one School Days configuration must remain.'); return; }
  modalConfirmDelete({
    title:'Delete School Days entry?',
    lines:[
      cfg.schoolDays.length ? cfg.schoolDays.slice().sort().map(i=>WEEKDAYS[i]).join(', ') : 'No school days',
      `Effective from ${niceDate(cfg.effectiveFrom)}`
    ],
    onConfirm: ()=>{
      state.schoolDayConfigs = state.schoolDayConfigs.filter(c=>c.id!==id);
      state.settings.schoolDays = [...currentSchoolDaysConfig().schoolDays]; // refresh legacy mirror
      scheduleSave(); closeModal(); render(); showToast('School Days entry deleted');
    }
  });
}

   creates/updates a version effective from TODAY. This is for fixing a mistake

/* Remove an E-Bank (opened from the red minus in Settings → Money's manage mode).
   Three situations, all handled without rewriting history or changing Total Money:
   - Balance is zero → simple confirm. The bank is deleted outright if nothing ever
     used it, otherwise archived so past transactions keep resolving its name.
   - Balance is positive → the person picks where that money goes; it's recorded as a
     normal transfer (Total Money unchanged), then the now-empty bank is removed.
   - Balance is negative (overdrawn) → blocked with an explanation; nothing to move. */
function modalRemoveSource(node){
  const g = nodeGroup(node);
  if(node==='cash'){ showToast("Cash on Hand can't be removed"); return; }
  if(g!=='funds' && g!=='scholar') return;
  const bank = g==='funds' ? fundsBankById(node.slice(6)) : scholarBankById(node.slice(6));
  if(!bank || bank.removedAt) return;
  const name = escapeHTML(bank.name);
  const groupLabel = g==='funds' ? 'Funds' : 'Scholar Allowance';
  const bal = computeAccountBalance(node);
  const hasHistory = nodeReferenceCount(node) > 0;
  const targets = [...activeFundsNodes(), ...activeScholarNodes()].filter(n=>n!==node);
  let target = g==='funds' ? 'cash' : (activeScholarNodes().find(n=>n!==node) || 'cash');

  const bodyHTML = ()=>{
    if(bal < -0.005){
      return `
      <button class="closex" id="m-close">✕</button>
      <h3>Can't remove ${name} yet</h3>
      <p style="color:var(--ink-soft);font-size:13.5px;margin-top:-6px">${name} is overdrawn by <strong class="mono">${fmt(-bal)}</strong>, so there is no balance to move. Resolve the transactions that caused this first, then try again.</p>
      <div class="modalfoot"><button class="btn btn-ghost" id="m-cancel">Close</button></div>`;
    }
    if(bal > 0.005){
      const cross = nodeGroup(target)!==g;
      return `
      <button class="closex" id="m-close">✕</button>
      <h3>Remove ${name}?</h3>
      <p style="color:var(--ink-soft);font-size:13.5px;margin-top:-6px">${name} still holds <strong class="mono">${fmt(bal)}</strong>. Choose where to move it — it's recorded as a transfer, so your Total Money doesn't change.</p>
      <div class="field"><label>Move balance to</label>
        <div class="radiogroup" id="rm-targets">${targets.map(n=>`<button type="button" class="radiopill ${n===target?'sel':''}" data-rm-target="${n}">${escapeHTML(nodeLabel(n))} · ${accountLabel(n)}</button>`).join('')}</div>
        ${cross ? `<div class="helptext">This moves the money out of ${groupLabel} and into ${accountLabel(target)}.</div>` : ''}
      </div>
      <div class="helptext" style="margin-bottom:8px">Past transactions stay in your history exactly as recorded.</div>
      <div class="modalfoot">
        <button class="btn btn-ghost" id="m-cancel">Cancel</button>
        <button class="btn btn-danger" id="rm-confirm">Move &amp; remove</button>
      </div>`;
    }
    return `
      <button class="closex" id="m-close">✕</button>
      <h3>Remove ${name}?</h3>
      <p style="color:var(--ink-soft);font-size:13.5px;margin-top:-6px">${hasHistory
        ? `${name} has past transactions. They stay in your history exactly as recorded — ${name} just won't be available for new entries.`
        : `${name} has no transactions yet, so it will be removed completely.`}</p>
      <div class="modalfoot">
        <button class="btn btn-ghost" id="m-cancel">Cancel</button>
        <button class="btn btn-danger" id="rm-confirm">Remove</button>
      </div>`;
  };
  const wire = ()=>{
    document.getElementById('m-close').onclick = closeModal;
    document.getElementById('m-cancel').onclick = closeModal;
    document.querySelectorAll('[data-rm-target]').forEach(b=>{
      b.onclick = ()=>{ target = b.dataset.rmTarget; refresh(); };
    });
    const confirmBtn = document.getElementById('rm-confirm');
    if(confirmBtn) confirmBtn.onclick = ()=>{
      if(bal > 0.005){
        const tr = doTransfer(bal, node, target, todayStr());
        if(!tr.ok){ showToast(tr.msg); return; }
      }
      const res = removeMoneySource(node);
      if(!res.ok){ showToast(res.msg); return; }
      scheduleSave(); closeModal(); render(); showToast(`${bank.name} removed`);
    };
  };
  const refresh = ()=>{ document.getElementById('modalbody').innerHTML = bodyHTML(); wire(); };
  openModal(bodyHTML());
  wire();
}

async function fileToResizedDataURL(file, maxW){
  maxW = maxW || 480;
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.62));
      };
      img.onerror = ()=>resolve(null);
      img.src = e.target.result;
    };
    reader.onerror = ()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

        <button type="button" class="radiopill ${expenseType===NON_BUDGETED?'sel':''}" data-type="${NON_BUDGETED}">Non-Budgeted</button>
        <button type="button" class="radiopill ${expenseType===SURPLUS?'sel':''}" data-type="${SURPLUS}">Surplus</button>
      </div>
      <div class="helptext">${expenseType===BUDGETED ? 'Counts toward today\'s budget' : expenseType===SURPLUS ? 'Uses Credits' : 'Not counted toward budget'}</div>
    </div>

    ${expenseType===BUDGETED ? `
    <div class="field" id="exp-budget-wrap">
      <label>Counts toward</label>
      ${linkedBudget
        ? `<div class="radiopill sel" style="pointer-events:none;display:inline-block">${niceDate(linkedBudget.date)} · limit ${fmt(linkedBudget.amount)}</div>`
        : `<div class="helptext" style="color:var(--debt)">No budget set for this date — will save as Non-Budgeted.</div>`}
    </div>` : ''}
    ${expenseType===NON_BUDGETED && category==='Wants' ? `
    <div class="helptext" style="margin-bottom:14px;color:var(--debt)">Becomes Personal Debt · Payable only with Credits</div>
    ` : ''}
    ${expenseType===SURPLUS ? `<div class="helptext" style="margin-bottom:10px">Available Credits: <strong class="mono">${fmt(computeAccountBalance('extra'))}</strong></div>` : ''}

    ${isWantsDebt ? '' : `<div class="field"><label>Deduct From</label>${moneyNodePickerHTML(src, 'exp-source', srcGroup)}<div class="helptext" id="exp-balance-warn" style="color:var(--debt);font-weight:600;display:none"></div></div>`}

    <div class="field"><label>Notes (optional)</label><textarea id="exp-notes" placeholder="Anything to remember about this">${isEdit? (existing.notes||''):''}</textarea></div>
    <div class="field"><label>Photo (optional)</label>
      <input type="file" id="exp-photo" accept="image/*">
      <img id="exp-photo-preview" class="photopreview" style="${isEdit&&existing.photo?'display:block':''}" src="${isEdit&&existing.photo?existing.photo:''}">
    </div>
    <div class="modalfoot">
      <button class="btn btn-ghost" id="m-cancel">Cancel</button>
      <button class="btn btn-primary" id="exp-save">${isEdit?'Save changes':'Save expense'}</button>
    </div>
  `;
  };

  // The source must be one the person still has configured in Settings → Money. If the
  // default source points at a removed bank, fall back to Cash on Hand. (When EDITING an
  // expense that was paid from a since-removed bank, that bank stays selected as-is.)
  let src = (nodeIsActive(defaultSource) || (isEdit && existing.source===defaultSource)) ? defaultSource : 'cash';
  // Which of Funds / Scholar Allowance is showing — tracked separately from `src` so
  // Scholar Allowance can stay open (showing "No banks available") when it has no banks.
  let srcGroup = nodeGroup(src) || 'funds';
  let photoData = isEdit? (existing.photo||null) : null;
  openModal(bodyHTML());

  /* Live warning shown under "Deduct From" while typing, so the person sees right away
     that the amount is more than what the selected money source (or Credits, for a
     Surplus expense) actually has. The real block happens in onSave() below — this is
     just early feedback. */
  const updateWarn = ()=>{
    const el = document.getElementById('exp-balance-warn');
    const amtEl = document.getElementById('exp-amount');
    if(!amtEl || !el) return;
    const amt = parseFloat(amtEl.value) || 0;
    let msg = '';
    if(src && amt>0){
      const avail = balanceExcludingExpense(src, isEdit ? existing.id : null);
      if(amt > avail+0.001) msg = `Not enough in ${nodeLabel(src)} — ${fmt(Math.max(0,avail))} available`;
    }
    if(!msg && expenseType===SURPLUS && amt>0){
      const cr = balanceExcludingExpense('extra', isEdit ? existing.id : null);
      if(amt > cr+0.001) msg = `Not enough Credits — ${fmt(Math.max(0,cr))} available`;
    }
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  };

  const wire = ()=>{
    document.getElementById('exp-amount').oninput = updateWarn;
    updateWarn();
    const srcGroupContainer = document.getElementById('exp-source-group');
    if(srcGroupContainer){
      wireMoneyNodePicker('exp-source',
        (group)=>{
          srcGroup = group;
          src = group==='funds' ? 'cash' : (activeScholarBanks()[0] ? 'sbank:'+activeScholarBanks()[0].id : null);
          refresh();
        },
        (node)=>{ src = node; srcGroup = nodeGroup(node) || srcGroup; refresh(); }
      );
    }
    document.getElementById('exp-type').querySelectorAll('[data-type]').forEach(b=>{
      b.onclick = ()=>{
        expenseType = b.dataset.type;
        refresh();
      };
    });
    document.getElementById('exp-date').onchange = ()=>{ refresh(); };
    document.getElementById('exp-category').onchange = (e)=>{
      category = e.target.value;
      refresh();
    };
    document.getElementById('exp-photo').onchange = async (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      const preview = document.getElementById('exp-photo-preview');
      photoData = await fileToResizedDataURL(f);
      if(photoData){ preview.src = photoData; preview.style.display='block'; }
    };
    document.getElementById('m-close').onclick = closeModal;
    document.getElementById('m-cancel').onclick = closeModal;
    document.getElementById('exp-save').onclick = onSave;
  };

  // Preserve values that would otherwise be lost on refresh() (amount, notes, etc.)
  const refresh = ()=>{
    const amtVal = document.getElementById('exp-amount').value;
    const dateVal = document.getElementById('exp-date').value;
    const placeVal = document.getElementById('exp-place').value;
    const itemVal = document.getElementById('exp-item').value;
    const notesVal = document.getElementById('exp-notes').value;
    document.getElementById('modalbody').innerHTML = bodyHTML();
    document.getElementById('exp-amount').value = amtVal;
    document.getElementById('exp-date').value = dateVal;
    document.getElementById('exp-place').value = placeVal;
    document.getElementById('exp-item').value = itemVal;
    document.getElementById('exp-notes').value = notesVal;
    const preview = document.getElementById('exp-photo-preview');
    if(photoData){ preview.src = photoData; preview.style.display='block'; }
    wire();
  };

  const onSave = ()=>{
    const amount = parseFloat(document.getElementById('exp-amount').value);
    const date = document.getElementById('exp-date').value || t;
    let finalCategory = category;
    if(finalCategory==='__new__'){
      const nc = document.getElementById('exp-newcat').value.trim();
      if(!nc){ showToast('Enter a category name'); return; }
      finalCategory = nc;
      if(!state.categories.includes(nc)) state.categories.push(nc);
    }
    const place = document.getElementById('exp-place').value.trim();
    const item = document.getElementById('exp-item').value.trim();
    const notes = document.getElementById('exp-notes').value.trim();
    if(!amount || amount<=0){ showToast('Enter a valid amount'); return; }

    // Resolve budget link: only Budgeted expenses ever get a budgetId, and only if
    // a School-Day Budget (spending limit) actually exists for the chosen date.
    const linkedBudget = state.budgets.find(x=>x.date===date);
    let finalType = expenseType;
    let budgetId = null;
    if(finalType===BUDGETED){
      if(linkedBudget){ budgetId = linkedBudget.id; }
      else { finalType = NON_BUDGETED; showToast('No budget for that date — saved as Non-Budgeted'); }
    }

    // A Non-Budgeted "Wants" expense becomes Personal Debt instead of an immediate
    // deduction — it has no money source at all. Budgeted and Surplus (and any other
    // Non-Budgeted category) always require a real money source.
    const isWantsDebt = finalType===NON_BUDGETED && finalCategory==='Wants';
    let finalSource = null;
    if(!isWantsDebt){
      finalSource = src;
      if(!finalSource){
        showToast(srcGroup==='scholar'
          ? 'No Scholar Allowance banks available — add one in Settings → Money'
          : 'Choose a money source');
        return;
      }
      // HARD BLOCK: you can't spend more than the selected money source actually has.
      // When editing, the expense's own previous amount is excluded first (it was already
      // deducted), so the check compares against what's really available.
      const available = balanceExcludingExpense(finalSource, isEdit ? existing.id : null);
      if(amount > available + 0.001){
        showToast(`Insufficient balance`);
        return;
      }
    }
    if(finalType===SURPLUS){
      const availableExtra = balanceExcludingExpense('extra', isEdit ? existing.id : null);
      if(amount > availableExtra + 0.001){
        showToast(`Not enough Credits (${fmt(Math.max(0,availableExtra))} available)`);
        return;
      }
    }

    if(isEdit){
      existing.amount = round2(amount);
      existing.date = date;
      existing.category = finalCategory;
      existing.place = place;
      existing.item = item;
      existing.notes = notes;
      existing.photo = photoData;
      existing.source = finalSource;
      existing.expenseType = finalType;
      existing.budgetId = budgetId;
      syncDebtsAndExtras();
      scheduleSave(); closeModal(); render(); showToast('Expense updated');
    } else {
      addExpense({amount, date, category:finalCategory, place, item, notes, photo:photoData, source:finalSource, expenseType:finalType, budgetId});
      scheduleSave(); closeModal(); render(); showToast(isWantsDebt ? 'Expense added — became Personal Debt' : 'Expense added');
    }
  };

  wire();
}

function modalPayDebt(){
  const extraBal = computeAccountBalance('extra');
  const owedOverrun = totalOverrunDebt();
  const owedPersonal = totalPersonalDebt();
  let debtType = owedOverrun>0 ? 'overrun' : 'personal';

  const bodyHTML = ()=>{
    const owed = debtType==='overrun' ? owedOverrun : owedPersonal;
    const payAmt = Math.min(owed, extraBal);
    return `
    <button class="closex" id="m-close">✕</button>
    <h3>Pay with Credits</h3>
    <p style="color:var(--ink-soft);font-size:13px;margin-top:-8px">Credits available: <strong class="mono">${fmt(extraBal)}</strong></p>
    <div class="field">
      <label>Which debt?</label>
      <div class="radiogroup" id="pay-type">
        <button type="button" class="radiopill ${debtType==='overrun'?'sel':''} ${owedOverrun<=0?'disabled':''}" data-type="overrun" ${owedOverrun<=0?'disabled':''}>Overrun Debt · ${fmt(owedOverrun)}</button>
        <button type="button" class="radiopill ${debtType==='personal'?'sel':''} ${owedPersonal<=0?'disabled':''}" data-type="personal" ${owedPersonal<=0?'disabled':''}>Personal Debt · ${fmt(owedPersonal)}</button>
      </div>
    </div>
    <div class="field">
      <label>Payment source</label>
      <div class="radiopill sel" style="pointer-events:none;display:inline-block">Credits · ${fmt(extraBal)} available</div>
    </div>
    <div class="field"><label>Amount (₱)</label><input type="number" id="pay-amount" min="0" step="0.01" value="${payAmt>0?payAmt:''}"></div>
    ${extraBal<=0 ? `<div class="helptext">No Credits available yet</div>` : ''}
    <div class="modalfoot">
      <button class="btn btn-ghost" id="m-cancel">Cancel</button>
      <button class="btn btn-danger" id="pay-save" ${extraBal<=0||owed<=0?'disabled':''}>Confirm payment</button>
    </div>
  `;
  };
  const wire = ()=>{
    document.getElementById('m-close').onclick = closeModal;
    document.getElementById('m-cancel').onclick = closeModal;
    document.getElementById('pay-type').querySelectorAll('[data-type]').forEach(b=>{
      b.onclick = ()=>{
        if(b.disabled) return;
        debtType = b.dataset.type;
        refresh();
      };
    });
    document.getElementById('pay-save').onclick = ()=>{
      const amt = parseFloat(document.getElementById('pay-amount').value);
      if(!amt || amt<=0){ showToast('Enter a valid amount'); return; }
      const res = payDebt(amt, 'extra', debtType);
      if(!res.ok){ showToast(res.msg); return; }
      scheduleSave(); closeModal(); render(); showToast('Debt payment recorded');
    };
  };
  const refresh = ()=>{ document.getElementById('modalbody').innerHTML = bodyHTML(); wire(); };
  openModal(bodyHTML());
  wire();
}

      `${niceDate(exp.date)} · ${expenseTypeLabel(exp.expenseType)}`,
      exp.expenseType===BUDGETED
        ? 'This will remove it from spending history, budget calculations, category totals, and related financial calculations.'
        : 'This will remove it from spending history and return the money to its source. It was never part of the school-day budget.'
    ],
    onConfirm: ()=>{
      const res = deleteExpenseTx(exp.id);
      if(res.ok){ scheduleSave(); render(); showToast('Expense deleted'); }
      else showToast(res.msg);
    }
  });
}

function promptDeleteTransfer(id){
  const tx = state.transfers.find(x=>x.id===id);
  if(!tx) return;
  modalConfirmDelete({
    title:'Delete Transfer?',
    lines:[`${accountLabel(tx.from)} → ${accountLabel(tx.to)} · ${fmt(tx.amount)}`, niceDate(tx.date)],
    onConfirm: ()=>{
      const res = deleteTransferTx(tx.id, false);
      if(res.ok){ scheduleSave(); render(); showToast('Transfer deleted'); return; }
      if(res.needsForce){
        modalConfirmDelete({
          title:'Delete Transfer?',
          lines:[`${accountLabel(tx.from)} → ${accountLabel(tx.to)} · ${fmt(tx.amount)}`, niceDate(tx.date)],
          warn: res.msg,
          onConfirm: ()=>{
            const r2 = deleteTransferTx(tx.id, true);
            if(r2.ok){ scheduleSave(); render(); showToast('Transfer deleted'); }
            else showToast(r2.msg);
          }
        });
        return;
      }
      showToast(res.msg);
    }
  });
}

function promptDeleteBudget(id){
  const b = state.budgets.find(x=>x.id===id);
  if(!b) return;
  modalConfirmDelete({
    title:'Delete Budget?',
    lines:[`${niceDate(b.date)} · ${fmt(b.amount)}`],
    onConfirm: ()=>{
      const res = deleteBudgetTx(b.id, false);
      if(res.ok){ scheduleSave(); render(); showToast('Budget deleted'); return; }
      if(res.needsForce){
        modalConfirmDelete({
          title:'Delete Budget?',
          lines:[`${niceDate(b.date)} · ${fmt(b.amount)}`],
          warn: res.msg,
          onConfirm: ()=>{
            const r2 = deleteBudgetTx(b.id, true);
            if(r2.ok){ scheduleSave(); render(); showToast('Budget deleted'); }
            else showToast(r2.msg);
          }
        });
        return;
      }
      showToast(res.msg);
    }
  });
}

/* ============================= EVENT WIRING PER PAGE ============================= */
function wirePageEvents(tab){
  if(tab==='dashboard'){
    document.querySelectorAll('[data-tab]').forEach(b=>{ if(!b.closest('.sidenav')&&!b.closest('.bottomnav')){ b.onclick = ()=>{ currentTab=b.dataset.tab; render(); }; } });
  }
  if(tab==='budget'){
    const t = todayStr();
    const cd = document.getElementById('budget-create-day'); if(cd) cd.onclick = ()=>modalBudget(null, budgetViewDate);
    const ed = document.getElementById('budget-edit-day'); if(ed) ed.onclick = ()=>modalBudget(state.budgets.find(b=>b.date===budgetViewDate));
    const dd = document.getElementById('budget-delete-day'); if(dd) dd.onclick = ()=>{
      const b = state.budgets.find(x=>x.date===budgetViewDate);
      if(b) promptDeleteBudget(b.id);
    };
    const cl = document.getElementById('budget-close-day'); if(cl) cl.onclick = ()=>{
      const b = state.budgets.find(x=>x.date===budgetViewDate);
      if(!b) return;
      if(confirm(`Finalize the ${niceDate(budgetViewDate)} budget now? This locks in the amount; excess/overrun already reflects recorded spending.`)){
        closeBudget(b);
        syncDebtsAndExtras();
        scheduleSave(); render(); showToast('Budget finalized');
      }
    };
    const rp = document.getElementById('budget-reopen-day'); if(rp && !rp.disabled) rp.onclick = ()=>{
      const b = state.budgets.find(x=>x.date===budgetViewDate);
      if(!b) return;
      reopenBudget(b);
      syncDebtsAndExtras();
      scheduleSave(); render(); showToast('Budget unlocked for editing');
    };
    document.querySelectorAll('[data-day-select]').forEach(el=>{
      el.onclick = ()=>{ budgetViewDate = el.dataset.daySelect; render(); };
    });
    const pw = document.getElementById('budget-prevweek'); if(pw) pw.onclick = ()=>{ budgetViewDate = addDays(budgetViewDate, -7); render(); };
    const nw = document.getElementById('budget-nextweek'); if(nw) nw.onclick = ()=>{ budgetViewDate = addDays(budgetViewDate, 7); render(); };
    const bt = document.getElementById('budget-today'); if(bt) bt.onclick = ()=>{ budgetViewDate = t; render(); };
    const dj = document.getElementById('budget-datejump'); if(dj) dj.onchange = ()=>{ if(dj.value){ budgetViewDate = dj.value; render(); } };
  }
  if(tab==='spending'){
    document.getElementById('spend-add').onclick = ()=>modalExpense();
    document.querySelectorAll('[data-expense]').forEach(el=>{
      el.onclick = ()=>expenseDetailModal(el.dataset.expense);
    });
    document.querySelectorAll('[data-edit-expense]').forEach(el=>{
      el.onclick = (ev)=>{ ev.stopPropagation(); modalExpense(el.dataset.editExpense); };
    });
    document.querySelectorAll('[data-delete-expense]').forEach(el=>{
      el.onclick = (ev)=>{ ev.stopPropagation(); promptDeleteExpense(el.dataset.deleteExpense); };
    });
  }
  if(tab==='variance'){
    const pb = document.getElementById('debt-pay'); if(pb) pb.onclick = ()=>modalPayDebt();
    const ad = document.getElementById('debt-add-normal'); if(ad) ad.onclick = ()=>modalAddNormalDebt();
    document.querySelectorAll('[data-pay-normal]').forEach(el=>{
      el.onclick = (ev)=>{ ev.stopPropagation(); modalPayNormalDebt(el.dataset.payNormal); };
    });
    document.querySelectorAll('[data-normal-detail]').forEach(el=>{
      el.onclick = ()=>normalDebtDetailModal(el.dataset.normalDetail);
    });
  }
  if(tab==='settings'){
    if(settingsView==='menu'){
      document.querySelectorAll('[data-settings-nav]').forEach(el=>{
        el.onclick = ()=>{ settingsView = el.dataset.settingsNav; sourceEditMode = false; render(); };
      });
      return;
    }
    const backBtn = document.getElementById('settings-back');
    if(backBtn) backBtn.onclick = ()=>{ settingsView = 'menu'; sourceEditMode = false; render(); };

    if(settingsView==='personal'){
      document.getElementById('settings-editprofile').onclick = ()=>modalEditProfile();
      const addPhoneBtn = document.getElementById('settings-add-phone');
      if(addPhoneBtn) wireInlineAddContact(addPhoneBtn, 'phone');
      const addEmailBtn = document.getElementById('settings-add-email');
      if(addEmailBtn) wireInlineAddContact(addEmailBtn, 'email');
      document.querySelectorAll('[data-remove-phone]').forEach(el=>{
        el.onclick = ()=>removeContactEntry('phone', parseInt(el.dataset.removePhone));
      });
      document.querySelectorAll('[data-remove-email]').forEach(el=>{
        el.onclick = ()=>removeContactEntry('email', parseInt(el.dataset.removeEmail));
      });
    }
    if(settingsView==='privacy'){
      document.getElementById('settings-changepin').onclick = ()=>modalChangePin();
      document.getElementById('settings-account-recovery').onclick = ()=>{
        modalVerifyPinThen(
          ()=>{ modalEditSecurityQuestion(); },
          'Enter PIN',
          'Confirm your PIN to view or edit Account Recovery.'
        );
      };
      document.getElementById('settings-reset-app').onclick = ()=>modalConfirmReset();
    }
    if(settingsView==='money'){
      document.getElementById('money-transfer').onclick = ()=>modalTransfer();
      document.querySelectorAll('[data-sub]').forEach(b=>{
        b.onclick = ()=>{ moneySubtab = b.dataset.sub; sourceEditMode = false; document.getElementById('money-body').innerHTML = moneySubtabHTML(moneySubtab);
          document.querySelectorAll('[data-sub]').forEach(x=>x.classList.toggle('active', x.dataset.sub===moneySubtab));
          wireMoneyBodyEvents();
          wireVisibilityToggles();
        };
      });
      wireMoneyBodyEvents();
    }
    if(settingsView==='schooldays'){
      const showHistBtn = document.getElementById('schooldays-show-history');
      if(showHistBtn) showHistBtn.onclick = ()=>modalSchoolDaysHistory();
      document.querySelectorAll('#schooldays-grid [data-day]').forEach(el=>{
        el.onclick = ()=>{ el.classList.toggle('on'); };
      });
      // Default expense source picker — selects among the sources configured in
      // Settings → Money only (no bank creation here).
      let defGroup = nodeGroup(nodeIsActive(state.settings.defaultSource) ? state.settings.defaultSource : 'cash') || 'funds';
      const redrawSrcPicker = ()=>{
        const cur = nodeIsActive(state.settings.defaultSource) ? state.settings.defaultSource : 'cash';
        document.getElementById('set-src-picker').innerHTML = moneyNodePickerHTML(cur, 'set-src', defGroup);
        wireSrcPicker();
      };
      const wireSrcPicker = ()=>{
        wireMoneyNodePicker('set-src',
          (group)=>{
            defGroup = group;
            if(group==='funds'){ state.settings.defaultSource = 'cash'; scheduleSave(); }
            else if(activeScholarBanks()[0]){ state.settings.defaultSource = 'sbank:'+activeScholarBanks()[0].id; scheduleSave(); }
            redrawSrcPicker();
          },
          (node)=>{
            state.settings.defaultSource = node;
            defGroup = nodeGroup(node) || defGroup;
            scheduleSave();
            redrawSrcPicker();
          }
        );
      };
      wireSrcPicker();
      document.getElementById('settings-save').onclick = ()=>{
        const days = [...document.querySelectorAll('#schooldays-grid .on')].map(el=>parseInt(el.dataset.day));
        const amt = parseFloat(document.getElementById('set-defaultbudget').value)||0;
        applySchoolDaysChange(days);
        state.settings.defaultBudget = amt;
        scheduleSave(); showToast('Settings saved'); render();
      };
    }
  }
}
function wireMoneyBodyEvents(){
  // 3-dot button: toggles "remove sources" mode. Red minus icons only exist while it's on.
  const manageBtn = document.getElementById('money-manage-sources');
  if(manageBtn) manageBtn.onclick = ()=>{ sourceEditMode = !sourceEditMode; render(); };
  document.querySelectorAll('[data-remove-source]').forEach(el=>{
    el.onclick = (ev)=>{ ev.stopPropagation(); modalRemoveSource(el.dataset.removeSource); };
  });
  ['funds','scholar'].forEach(k=>{
    const btn = document.getElementById(`money-add-${k}`);
    if(btn) btn.onclick = ()=>modalIncome(k);
    const addBankBtn = document.getElementById(`money-addbank-${k}`);
    if(addBankBtn) addBankBtn.onclick = ()=>modalAddBank(k);
  });
  document.querySelectorAll('[data-edit-income]').forEach(el=>{
    el.onclick = ()=>{
      const group = el.dataset.incomeGroup;
      const tx = state.incomeTx.find(x=>x.id===el.dataset.editIncome);
      if(tx) modalIncome(group, tx);
    };
  });
  document.querySelectorAll('[data-delete-income]').forEach(el=>{
    el.onclick = ()=>promptDeleteIncome(el.dataset.deleteIncome);
  });
  document.querySelectorAll('[data-delete-transfer]').forEach(el=>{
    el.onclick = ()=>promptDeleteTransfer(el.dataset.deleteTransfer);
  });
}
/* ============================= INIT ============================= */
loadState();
</script>
